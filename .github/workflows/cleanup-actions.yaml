name: cleanup-actions

on:
  workflow_run:
    workflows:
      - build
      - build-nexgen-react
    types:
      - completed
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      retention_hours:
        description: "保留最近多少小时内创建的已完成运行记录，0 表示尽快清空"
        required: false
        type: string
        default: "0"
      max_delete:
        description: "单次最多删除多少条运行记录"
        required: false
        type: string
        default: "1000"

permissions:
  actions: write
  contents: read

concurrency:
  group: cleanup-actions
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const retentionHours = Number(
              context.payload.inputs?.retention_hours ??
              process.env.CLEANUP_RETENTION_HOURS ??
              0
            );
            const maxDelete = Number(
              context.payload.inputs?.max_delete ??
              process.env.CLEANUP_MAX_DELETE ??
              1000
            );
            const cutoff = Date.now() - Math.max(0, retentionHours) * 60 * 60 * 1000;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentRunId = context.runId;
            let deleted = 0;
            let skipped = 0;
            let failed = 0;

            for await (const page of github.paginate.iterator(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
            })) {
              for (const run of page.data) {
                if (deleted >= maxDelete) break;
                if (run.id === currentRunId || run.status !== "completed") {
                  skipped += 1;
                  continue;
                }
                if (new Date(run.created_at).getTime() > cutoff) {
                  skipped += 1;
                  continue;
                }

                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  deleted += 1;
                } catch (error) {
                  failed += 1;
                  core.warning(`删除运行记录失败：${run.id} ${run.name || ""} ${error.status || ""} ${error.message}`);
                }
              }
              if (deleted >= maxDelete) break;
            }

            core.info(`已删除 ${deleted} 条 Actions 运行记录，跳过 ${skipped} 条，失败 ${failed} 条。`);
