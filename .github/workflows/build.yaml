name: build

on:
  workflow_dispatch:
    inputs:
      client:
        description: '客户端类型'
        required: false
        type: string
        default: 'xboard_mihomo_sub'
      profile:
        description: '配置档案名称（对应配置分支 profiles 目录中的 YAML 档案名）'
        required: true
        type: string
      profile_branch:
        description: '配置档案分支（默认 profiles）'
        required: false
        type: string
        default: 'profiles'
      tag:
        description: '构建版本号/产物标签（用于 setup.dart --version 和产物命名，例如 v0.1.0）'
        required: true
        type: string
      branch:
        description: '源码分支（如: main, feature/sspanel）'
        required: false
        type: string
        default: 'main'
      core:
        description: '打包内核（mihomo 或 xray）'
        required: false
        type: choice
        default: 'mihomo'
        options:
          - mihomo
          - xray
      platforms:
        description: '选择要编译的平台（多选用逗号分隔，如: windows,android 或 linux-amd64）'
        required: true
        type: string
        default: 'all'
        # 可选值: all, windows, windows-amd64, windows-arm64, android, android-tv, linux, linux-arm64, linux-amd64, macos-arm64, macos-amd64
        # 注意: all 包含 windows/linux/macos 双架构，以及 android-tv
        # 示例: windows,android 或 windows-arm64,linux-amd64,macos-arm64
      request_id:
        description: '构建请求唯一标识（由配置服务器生成，用于匹配本次构建运行）'
        required: false
        type: string

run-name: build-${{ github.event.inputs.request_id || github.run_id }}-${{ github.event.inputs.core || 'mihomo' }}-${{ github.event.inputs.profile }}-${{ github.event.inputs.tag }}

concurrency:
  group: build-${{ github.event.inputs.profile }}
  cancel-in-progress: false

env:
  IS_STABLE: ${{ !contains(github.event.inputs.tag, '-') }}
  PROFILE_REPO: q42602736/Xboard-Mihomo_sub
  MIHOMO_SOURCE_REPO: q42602736/Xboard-Mihomo_sub
  XRAY_SOURCE_REPO: q42602736/NexGen-client-xray
  FLUTTER_VERSION: "3.47.1"

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
      upload_url: ${{ steps.release.outputs.upload_url }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      app_name: ${{ steps.release.outputs.app_name }}
    steps:
      - name: Validate Config Server Callback
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
        run: |
          if [ -z "$REQUEST_ID" ]; then
            echo "::error::缺少 request_id，配置服务器无法绑定本次打包记录。"
            exit 1
          fi
          if [ -z "$CONFIG_SERVER_URL" ]; then
            echo "::error::缺少 GitHub Actions secret: CONFIG_SERVER_URL"
            exit 1
          fi
          if [ -z "$CONFIG_SERVER_EVENT_TOKEN" ]; then
            echo "::error::缺少 GitHub Actions secret: CONFIG_SERVER_EVENT_TOKEN"
            exit 1
          fi

      - name: Prepare Draft Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          PROFILE_NAME="${{ github.event.inputs.profile }}"
          PROFILE_BRANCH="${{ github.event.inputs.profile_branch }}"
          VERSION="${{ github.event.inputs.tag }}"
          RELEASE_TAG="${PROFILE_NAME}-${VERSION}-${{ github.run_id }}"
          PROFILE_PATH="profiles/$PROFILE_NAME.yaml"
          ENCODED_PROFILE_PATH=$(node -e "console.log(process.argv[1].split('/').map(encodeURIComponent).join('/'))" "$PROFILE_PATH")

          API_RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ env.PROFILE_REPO }}/contents/${ENCODED_PROFILE_PATH}?ref=${PROFILE_BRANCH}")

          if echo "$API_RESPONSE" | grep -q '"content"'; then
            PROFILE_YAML=$(echo "$API_RESPONSE" | node -e "
              const d=require('fs').readFileSync(0,'utf8');
              const j=JSON.parse(d);
              if (j.content) process.stdout.write(Buffer.from(String(j.content).replace(/\\n/g, ''), 'base64').toString());
            ")

            APP_NAME=$(printf '%s' "$PROFILE_YAML" | node -e "
              const fs = require('fs');
              const yaml = fs.readFileSync(0, 'utf8');
              const appBlockMatch = yaml.match(/(?:^|\r?\n)  app:\r?\n((?:    .*?(?:\r?\n|$)|\r?\n)*)/);
              const appTitleMatch = appBlockMatch ? appBlockMatch[1].match(/(?:^|\r?\n)    title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/) : null;
              const rootTitleMatch = yaml.match(/(?:^|\r?\n)  title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/);
              const rawName = appTitleMatch ? appTitleMatch[1].trim() : (rootTitleMatch ? rootTitleMatch[1].trim() : '$PROFILE_NAME');
              process.stdout.write(String(rawName || '').replace(/[\\r\\n]+/g, ' ').trim());
            ")
          else
            echo "Failed to get profile yaml, using profile name as app name"
            APP_NAME="$PROFILE_NAME"
          fi

          echo "Preparing draft release: ${APP_NAME} ${VERSION} (tag: ${RELEASE_TAG})"

          EXISTING_RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${RELEASE_TAG}")
          EXISTING_ID=$(printf '%s' "$EXISTING_RESPONSE" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf8'));
            process.stdout.write(data && data.id ? String(data.id) : '');
          ")

          if [ -n "$EXISTING_ID" ]; then
            echo "Release ${RELEASE_TAG} already exists, deleting..."
            curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/${EXISTING_ID}" > /dev/null
          fi

          RELEASE_PAYLOAD=$(node -e '
            const [appName, version, releaseTag, profileName] = process.argv.slice(1);
            process.stdout.write(JSON.stringify({
              tag_name: releaseTag,
              name: `${appName} ${version}`,
              draft: true,
              body: `${appName} ${version} 构建产物\n\n档案: ${profileName}`
            }));
          ' "$APP_NAME" "$VERSION" "$RELEASE_TAG" "$PROFILE_NAME")

          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$RELEASE_PAYLOAD")

          RELEASE_ID=$(printf '%s' "$RELEASE_RESPONSE" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf8'));
            process.stdout.write(data && data.id ? String(data.id) : '');
          ")
          UPLOAD_URL=$(printf '%s' "$RELEASE_RESPONSE" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf8'));
            process.stdout.write((data && data.upload_url ? String(data.upload_url) : '').replace(/\\{.*$/, ''));
          ")

          if [ -z "$RELEASE_ID" ] || [ -z "$UPLOAD_URL" ]; then
            echo "Failed to create draft release"
            printf "%s" "$RELEASE_RESPONSE" | node -e 'const fs=require("fs"); const raw=fs.readFileSync(0,"utf8"); try { const data=JSON.parse(raw); console.log(JSON.stringify({message:data.message||"", status:data.status||"", documentation_url:data.documentation_url||"", errors:Array.isArray(data.errors)?data.errors.map(e=>({resource:e.resource,field:e.field,code:e.code})):[]})); } catch { console.log(String(raw).replace(/https?:\/\/\S+/g,"https://[redacted]").slice(0,1000)); }'
            exit 1
          fi

          echo "release_id=$RELEASE_ID" >> $GITHUB_OUTPUT
          echo "upload_url=$UPLOAD_URL" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Draft release ready: https://github.com/${{ github.repository }}/releases"

      - name: Bind Build Record
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          if [ -z "$CONFIG_SERVER_URL" ] || [ -z "$CONFIG_SERVER_EVENT_TOKEN" ] || [ -z "$REQUEST_ID" ]; then
            echo "Skip bind callback: missing CONFIG_SERVER_URL / CONFIG_SERVER_EVENT_TOKEN / request_id"
            exit 0
          fi

          CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/bind"
          PAYLOAD=$(node -e '
            const payload = {
              request_id: process.env.REQUEST_ID,
              run_id: Number(process.env.RUN_ID || 0),
              run_url: process.env.RUN_URL || "",
              status: "in_progress",
              release_tag: process.env.RELEASE_TAG || "",
              progress_percent: 15,
              progress_stage: "release",
              progress_text: "GitHub Actions 已接收，正在准备构建环境"
            };
            process.stdout.write(JSON.stringify(payload));
          ')

          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
            -d "$PAYLOAD"

  build:
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            build_platform: windows
            os: Windows-2022
            arch: amd64
            include_in_all: true
          - platform: windows
            build_platform: windows
            os: windows-11-arm
            arch: arm64
            include_in_all: true
          - platform: android
            build_platform: android
            build_flavor: mobile
            os: ubuntu-latest
            # 显式固定 mobile flavor，避免 all 把 tv 产物一起打出来
            include_in_all: true
          - platform: android-tv
            build_platform: android
            build_flavor: tv
            build_target: lib/main_tv.dart
            os: ubuntu-latest
            include_in_all: true
          - platform: macos
            build_platform: macos
            os: macos-latest
            arch: arm64
            include_in_all: true
          - platform: macos
            build_platform: macos
            os: macos-15-intel
            arch: amd64
            include_in_all: true

    steps:
      - name: Check if platform should run
        id: check
        run: |
          SELECTED="${{ github.event.inputs.platforms }}"
          CORE="${{ github.event.inputs.core || 'mihomo' }}"
          CURRENT="${{ matrix.platform }}"
          BUILD_PLATFORM="${{ matrix.build_platform }}"
          ARCH="${{ matrix.arch }}"
          INCLUDE_IN_ALL="${{ matrix.include_in_all }}"

          echo "Selected platforms: $SELECTED"
          echo "Selected core: $CORE"
          echo "Current matrix: platform=$CURRENT, build_platform=$BUILD_PLATFORM, arch=$ARCH"

          SHOULD_RUN="false"

          # 检查是否选择了 all
          if [[ "$SELECTED" == "all" ]] && [ "$INCLUDE_IN_ALL" = "true" ]; then
            SHOULD_RUN="true"
          # 检查是否包含当前平台
          elif [[ ",$SELECTED," == *",$CURRENT,"* ]]; then
            SHOULD_RUN="true"
          # Windows 特殊处理
          elif [[ ",$SELECTED," == *",windows-arm64,"* ]] && [ "$CURRENT" = "windows" ] && [ "$ARCH" = "arm64" ]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",windows-amd64,"* ]] && [ "$CURRENT" = "windows" ] && [ "$ARCH" = "amd64" ]; then
            SHOULD_RUN="true"
          # macOS 特殊处理
          elif [[ ",$SELECTED," == *",macos-arm64,"* ]] && [ "$CURRENT" = "macos" ] && [ "$ARCH" = "arm64" ]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",macos-amd64,"* ]] && [ "$CURRENT" = "macos" ] && [ "$ARCH" = "amd64" ]; then
            SHOULD_RUN="true"
          # Linux 特殊处理
          elif [[ ",$SELECTED," == *",linux-arm64,"* ]] && [ "$CURRENT" = "linux" ] && [ "$ARCH" = "arm64" ]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",linux-amd64,"* ]] && [ "$CURRENT" = "linux" ] && [ "$ARCH" = "amd64" ]; then
            SHOULD_RUN="true"
          fi

          if [ "$CORE" = "xray" ] && { [ "$CURRENT" = "android-tv" ] || [ "$CURRENT" = "linux" ]; }; then
            SHOULD_RUN="false"
          fi

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

          if [ "$SHOULD_RUN" = "false" ]; then
            echo "⏭️ Skipping $CURRENT ($ARCH) - not selected"
          else
            echo "✅ Building $CURRENT ($ARCH)"
          fi

      - name: Report Build Started
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: ${{ matrix.platform }} ${{ matrix.arch }}
          PLATFORM_KEY: ${{ matrix.build_platform == 'windows' && format('windows-{0}', matrix.arch) || matrix.build_platform == 'macos' && format('macos-{0}', matrix.arch) || matrix.platform }}
        run: |
          CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/progress"
          PAYLOAD=$(node -e '
            const label = process.env.PLATFORM_LABEL || "客户端";
            const payload = {
              request_id: process.env.REQUEST_ID,
              run_id: Number(process.env.RUN_ID || 0),
              run_url: process.env.RUN_URL || "",
              status: "in_progress",
              progress_percent: 35,
              progress_stage: "build",
              progress_text: "",
              progress_detail: {
                key: process.env.PLATFORM_KEY || label,
                label,
                status: "in_progress",
                stage: "build",
                text: ""
              }
            };
            process.stdout.write(JSON.stringify(payload));
          ')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
            -d "$PAYLOAD" || true

      - name: Free Disk Space (Android)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false  # 保留Android SDK
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Additional Disk Cleanup (Android)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        run: |
          echo "=== 额外清理磁盘空间 ==="
          df -h

          # 清理Android SDK不需要的部分（保留NDK，构建需要）
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3[0-3]*
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-3[0-3]
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator

          echo ""
          echo "清理后磁盘使用情况:"
          df -h

      - name: Setup SSH
        if: steps.check.outputs.should_run == 'true'
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone private repo
        if: steps.check.outputs.should_run == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          CORE="${{ github.event.inputs.core || 'mihomo' }}"
          SOURCE_REPO="${{ env.MIHOMO_SOURCE_REPO }}"
          if [ "$CORE" = "xray" ]; then
            SOURCE_REPO="${{ env.XRAY_SOURCE_REPO }}"
          fi
          echo "Selected core: $CORE"
          echo "Source repo: $SOURCE_REPO"
          git clone "git@github.com:${SOURCE_REPO}.git" source
          cd source
          REQUESTED_REF="${{ github.event.inputs.branch }}"
          SOURCE_REF="$REQUESTED_REF"
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="${{ github.event.inputs.tag }}"
          fi
          echo "Requested source ref: ${REQUESTED_REF:-<empty>}"
          echo "Checking out source ref: $SOURCE_REF"
          git checkout "$SOURCE_REF"
          echo "Checked out commit: $(git rev-parse HEAD)"
          git submodule update --init --recursive

      - name: Apply profile config
        id: config
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          cd source
          PROFILE_NAME="${{ github.event.inputs.profile }}"
          PROFILE_BRANCH="${{ github.event.inputs.profile_branch }}"
          echo "=== Applying profile: $PROFILE_NAME ==="

          # 从配置仓库读取 YAML 配置档案，源码仓库与配置分支解耦
          PROFILE_PATH="profiles/$PROFILE_NAME.yaml"
          ENCODED_PROFILE_PATH=$(node -e "console.log(process.argv[1].split('/').map(encodeURIComponent).join('/'))" "$PROFILE_PATH")
          echo "Reading $PROFILE_PATH from ${{ env.PROFILE_REPO }}@$PROFILE_BRANCH..."
          API_RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ env.PROFILE_REPO }}/contents/${ENCODED_PROFILE_PATH}?ref=${PROFILE_BRANCH}")
          if ! echo "$API_RESPONSE" | grep -q '"content"'; then
            echo "Error: Failed to read $PROFILE_PATH from profile repo branch $PROFILE_BRANCH"
            printf "%s" "$API_RESPONSE" | node -e 'const fs=require("fs"); const raw=fs.readFileSync(0,"utf8"); try { const data=JSON.parse(raw); console.log(JSON.stringify({message:data.message||"", status:data.status||"", documentation_url:data.documentation_url||""})); } catch { console.log(String(raw).replace(/https?:\/\/\S+/g,"https://[redacted]").slice(0,1000)); }'
            exit 1
          fi
          printf '%s' "$API_RESPONSE" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf8'));
            process.stdout.write(Buffer.from(String(data.content || '').replace(/\\n/g, ''), 'base64').toString());
          " > assets/config/xboard.config.yaml

          # 使用 node 提取应用名称（清理换行，避免污染 GITHUB_OUTPUT）
          APP_NAME=$(node -e "
            const fs = require('fs');
            const yaml = fs.readFileSync('assets/config/xboard.config.yaml', 'utf8');
            const appBlockMatch = yaml.match(/(?:^|\r?\n)  app:\r?\n((?:    .*?(?:\r?\n|$)|\r?\n)*)/);
            const appTitleMatch = appBlockMatch ? appBlockMatch[1].match(/(?:^|\r?\n)    title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/) : null;
            const rootTitleMatch = yaml.match(/(?:^|\r?\n)  title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/);
            const rawName = appTitleMatch ? appTitleMatch[1].trim() : (rootTitleMatch ? rootTitleMatch[1].trim() : '$PROFILE_NAME');
            const appName = String(rawName || '').replace(/[\\r\\n]+/g, ' ').trim();
            console.log(appName);
          ")

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Successfully applied profile: $PROFILE_NAME, App Name: $APP_NAME"

          echo ""
          echo "=== Config file content (first 30 lines, redacted) ==="
          node - assets/config/xboard.config.yaml 30 <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const limit = Number(process.argv[3] || 30);
          const sensitive = /(token|secret|password|passwd|pwd|key|authorization|cookie|session|decrypt|encrypt|sign|keystore|credential|private|subscription|remote|url|host|domain|api|endpoint|server|panel)/i;
          const lines = fs.readFileSync(file, "utf8").split(/\r?\n/).slice(0, limit).map((line) => {
            const urlRedacted = line.replace(/https?:\/\/[^\s"'<>]+/gi, "https://[redacted]");
            const pair = urlRedacted.match(/^(\s*[^:#\n][^:\n]*:\s*)(.*)$/);
            if (pair && sensitive.test(pair[1])) return `${pair[1]}[redacted]`;
            return urlRedacted;
          });
          console.log(lines.join("\n"));
          NODE

      - name: Setup Android Signing
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > source/android/app/keystore.jks
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> source/android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> source/android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> source/android/local.properties

      - name: Setup Windows Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows'
        shell: bash
        run: |
          # 创建持久化工具目录
          TOOLS_DIR="/c/runner-tools"
          mkdir -p "$TOOLS_DIR"

          # 检查并安装jq
          if command -v jq &> /dev/null; then
            echo "✓ jq already available"
          else
            echo "Installing jq..."
            choco install jq -y --no-progress || true
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
            echo "/c/ProgramData/chocolatey/bin" >> $GITHUB_PATH
          fi

          # 检查并安装Inno Setup
          INNO_SETUP_PATH="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ -f "$INNO_SETUP_PATH" ]; then
            echo "✓ Inno Setup already available"
          else
            echo "Installing Inno Setup..."
            choco install innosetup -y --no-progress
            echo "/c/Program Files (x86)/Inno Setup 6" >> $GITHUB_PATH
          fi

          # 设置 CMake 参数以忽略 CMP0175 策略警告
          # 修复 flutter_inappwebview_windows 插件与新版 CMake 的兼容性问题
          echo "CMAKE_ARGS=-Wno-dev" >> $GITHUB_ENV
          echo "✓ CMake configured to ignore policy warnings"

      - name: Setup Rust (x64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows' && matrix.arch == 'amd64'
        shell: bash
        run: |
          if ! command -v cargo &> /dev/null; then
            echo "Installing Rust for x64..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          else
            echo "✓ Rust/Cargo already available"
          fi
          cargo --version

      - name: Setup Rust (Windows arm64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
            Write-Host "Installing Rust for arm64..."
            Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
            .\rustup-init.exe -y --default-toolchain stable
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
            Write-Host "✓ Rust/Cargo already available"
          }
          cargo --version

      - name: Diagnose Windows ARM64 Runner
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Write-Host "=== Runner Context ==="
          Write-Host "RUNNER_OS=$env:RUNNER_OS"
          Write-Host "RUNNER_ARCH=$env:RUNNER_ARCH"
          Write-Host "ImageOS=$env:ImageOS"
          Write-Host "ImageVersion=$env:ImageVersion"
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          Write-Host "PROCESSOR_IDENTIFIER=$env:PROCESSOR_IDENTIFIER"
          Write-Host ""
          Write-Host "=== PowerShell / Git / Bash ==="
          $PSVersionTable.PSVersion
          Get-Command git -ErrorAction SilentlyContinue | Format-List Source, Version
          Get-Command bash -ErrorAction SilentlyContinue | Format-List Source, Version
          Write-Host ""
          Write-Host "=== System Architecture ==="
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, OSArchitecture, Version
          Get-CimInstance Win32_Processor | Select-Object Name, Architecture, AddressWidth

      - name: Setup Go
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: source/core/go.sum

      - name: Setup Flutter (Windows x64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows' && matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          cache: true

      - name: Setup Flutter (Windows arm64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows' && matrix.arch == 'arm64'
        uses: subosito/flutter-action@v2
        with:
          # Flutter 官方 Windows release manifest 当前没有 arm64 独立条目，
          # 这里改走 git tag 安装，避免 flutter-action 按 stable manifest 解析失败。
          channel: "master"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          architecture: "arm64"
          cache: true

      - name: Verify Flutter (Windows arm64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows' && matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Write-Host "=== Flutter / Dart Command Path ==="
          where.exe flutter
          where.exe dart
          Write-Host ""
          Write-Host "=== Flutter / Dart Version ==="
          flutter --version
          dart --version
          Write-Host ""
          Write-Host "=== Flutter Doctor ==="
          flutter doctor -v

      - name: Setup Flutter (Android)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          cache: true

      - name: Setup Flutter (macOS)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'macos'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          cache: true

      - name: Setup Flutter (Linux amd64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'linux' && matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          architecture: "x64"
          cache: true

      - name: Setup Flutter (Linux arm64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'linux' && matrix.arch == 'arm64'
        uses: subosito/flutter-action@v2
        with:
          # Flutter 官方 Linux manifest 当前只提供 x64 条目，
          # arm64 需改走 git tag 安装，避免 setup.sh 按 manifest 架构过滤失败。
          channel: "master"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          architecture: "arm64"
          cache: true

      - name: Verify Flutter and Dart version
        if: steps.check.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          expected_flutter="${FLUTTER_VERSION}"
          actual_flutter="$(flutter --version | sed -nE 's/^Flutter ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          dart_version="$(dart --version 2>&1 | sed -nE 's/.*Dart SDK version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"

          if [ -z "$actual_flutter" ] || [ "$actual_flutter" != "$expected_flutter" ]; then
            echo "::error::Flutter 版本不匹配：期望 $expected_flutter，实际 ${actual_flutter:-无法识别}"
            exit 1
          fi

          if [ -z "$dart_version" ]; then
            echo "::error::无法识别 Dart SDK 版本"
            exit 1
          fi

          IFS=. read -r dart_major dart_minor dart_patch <<< "$dart_version"
          if (( dart_major < 3 || (dart_major == 3 && dart_minor < 12) )); then
            echo "::error::Dart SDK 版本过低：$dart_version，源码要求 >= 3.12.0"
            exit 1
          fi

          echo "Flutter 版本校验通过：$actual_flutter"
          echo "Dart SDK 版本校验通过：$dart_version"

      - name: Get Flutter Dependency
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          flutter pub get

      - name: 修补 flutter_inappwebview_macos 部署版本
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'macos'
        run: |
          set -euo pipefail

          cd source
          patched_files=()

          patch_package_manifest() {
            local package_file="$1"
            if [ ! -f "$package_file" ]; then
              return 0
            fi

            perl -0pi -e 's/\.macOS\("10\.14"\)/.macOS("10.15")/g' "$package_file"
            if grep -q '.macOS("10.14")' "$package_file"; then
              echo "::error::macOS 插件部署版本修补失败：$package_file"
              exit 1
            fi
            patched_files+=("$package_file")
          }

          patch_package_manifest \
            ".symlinks/plugins/flutter_inappwebview_macos/macos/Package.swift"

          while IFS= read -r package_file; do
            patch_package_manifest "$package_file"
          done < <(
            find "${PUB_CACHE:-$HOME/.pub-cache}" -type f \
              -path '*flutter_inappwebview_macos-*/macos/Package.swift' \
              -print
          )

          if [ "${#patched_files[@]}" -eq 0 ]; then
            echo "::error::找不到 flutter_inappwebview_macos 的 Package.swift"
            exit 1
          fi

          printf '已修补 flutter_inappwebview_macos 部署版本：%s\n' \
            "${patched_files[@]}"

      - name: Generate Executable Names
        if: steps.check.outputs.should_run == 'true'
        id: executable_names
        run: |
          cd source
          echo "=== Generating Executable Names ==="
          dart run scripts/generate_executable_names.dart
          echo ""
          echo "=== Generated Executable Names ==="
          grep "const String executableAppName" lib/generated/executable_names.dart || true

          # 从生成的文件中提取拼音应用名称
          PINYIN_NAME=$(grep "const String executableAppName = '" lib/generated/executable_names.dart | sed "s/.*const String executableAppName = '\([^']*\)'.*/\1/")
          echo "profile_name_safe=$PINYIN_NAME" >> $GITHUB_OUTPUT
          echo "Extracted pinyin name: $PINYIN_NAME"

      - name: Generate SDK Code
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source/lib/sdk/flutter_xboard_sdk
          flutter pub get
          dart run build_runner build

      - name: Generate Main Project Code
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          dart run build_runner build

      - name: Generate XBoard Config
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          echo "=== Generating XBoard Config ==="
          dart run tools/generate_config.dart
          echo ""
          echo "=== Generated Config (redacted preview) ==="
          node - lib/xboard/config/core/generated_config.dart 80 <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const limit = Number(process.argv[3] || 80);
          const sensitive = /(token|secret|password|passwd|pwd|key|authorization|cookie|session|decrypt|encrypt|sign|keystore|credential|private|subscription|remote|url|host|domain|api|endpoint|server|panel)/i;
          const lines = fs.readFileSync(file, "utf8").split(/\r?\n/).slice(0, limit).map((line) => {
            let output = line.replace(/https?:\/\/[^\s"',)]+/gi, "https://[redacted]");
            output = output.replace(/((?:token|secret|password|passwd|pwd|key|authorization|cookie|session|decrypt|encrypt|sign|keystore|credential|private|subscription|remote|url|host|domain|api|endpoint|server|panel)[A-Za-z0-9_]*\s*=\s*)(["`])([^"`]*)\2/gi, "$1$2[redacted]$2");
            if (sensitive.test(output) && /(["`]).*\1/.test(output)) {
              output = output.replace(/(["`])([^"`]*)\1/g, "$1[redacted]$1");
            }
            return output;
          });
          console.log(lines.join("\n"));
          NODE
          echo ""
          echo "=== Pubspec Assets Check ==="
          grep -A 10 "assets:" pubspec.yaml || echo "No assets section found"

      - name: Prepare Windows Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows'
        shell: bash
        run: |
          # 确保PATH包含Pub Cache bin和Inno Setup
          PUB_CACHE_BIN="/c/Users/$(whoami)/AppData/Local/Pub/Cache/bin"
          INNO_SETUP_DIR="/c/Program Files (x86)/Inno Setup 6"
          export PATH="$PUB_CACHE_BIN:$INNO_SETUP_DIR:$PATH"
          echo "$PUB_CACHE_BIN" >> $GITHUB_PATH
          echo "$INNO_SETUP_DIR" >> $GITHUB_PATH

          # 安装 flutter_distributor
          dart pub global activate flutter_distributor
          echo "✓ flutter_distributor installed"

      - name: Clean Windows Build Cache
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows'
        shell: bash
        run: |
          echo "🧹 清理 Windows 构建缓存（解决 CMake 安装问题）..."
          cd source
          # 删除 build/windows 目录（如果存在），确保干净构建
          rm -rf build/windows
          # 设置 CMake 策略环境变量，解决 flutter_inappwebview_windows 插件兼容性问题
          echo "CMAKE_POLICY_DEFAULT_CMP0175=OLD" >> $GITHUB_ENV
          # 忽略 CMake 开发者警告
          echo "CMAKE_NO_WARN_DEV=ON" >> $GITHUB_ENV
          echo "✓ 构建缓存已清理，CMake 策略已配置"

      - name: Prepare Android Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        run: |
          echo "Preparing Android build environment..."
          # 安装 flutter_distributor
          dart pub global activate flutter_distributor
          echo "✓ flutter_distributor installed"

      - name: Prepare macOS Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'macos'
        run: |
          echo "Preparing macOS build environment..."

          # 安装 flutter_distributor
          dart pub global activate flutter_distributor
          echo "✓ flutter_distributor installed"

          # 安装 appdmg (用于生成 DMG)
          npm install -g appdmg
          echo "✓ appdmg installed"

          # 运行 pod install
          cd source/macos
          pod install --repo-update
          echo "✓ CocoaPods dependencies installed"

      - name: Prepare Linux Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'linux'
        run: |
          echo "Preparing Linux build environment..."
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libepoxy-dev \
            libsecret-1-dev \
            libwayland-dev \
            libayatana-appindicator3-dev \
            libkeybinder-3.0-dev \
            curl \
            wget \
            xz-utils \
            zip \
            unzip \
            file \
            debian-archive-keyring
          # Ubuntu 24.04 已移除旧的 WPE 1.0 开发包，而 Ubuntu 22.04 的 WebKit API
          # 又不足以编译 flutter_inappwebview_linux。这里只额外引入 Debian trixie
          # 的 WPE 2.0 相关包，避免整套基础环境大范围切换发行版。
          echo "=== Add Debian trixie repository for WPE 2.0 packages ==="
          echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie main" | sudo tee /etc/apt/sources.list.d/debian-trixie.list > /dev/null
          cat <<'EOF' | sudo tee /etc/apt/preferences.d/debian-trixie-wpe.pref > /dev/null
          Package: *
          Pin: release n=trixie
          Pin-Priority: 100

          Package: libwpe* wpebackend-* libwpewebkit-2.0-1 libjavascriptcoregtk-6.0-* gir1.2-wpewebkit-6.0 gir1.2-javascriptcoregtk-6.0
          Pin: release n=trixie
          Pin-Priority: 990
          EOF
          sudo apt-get update -y
          echo "=== apt-cache policy (WPE packages) ==="
          apt-cache policy \
            base-files \
            libwpewebkit-2.0-dev \
            libwpebackend-fdo-1.0-dev \
            libwpe-1.0-dev || true
          # 这里不能再用 `-t trixie`，否则 apt 会把整个 Debian trixie 发行版都当成
          # 默认候选，像 base-files 这类基础包也会被拉进来，最终在 Ubuntu runner 上冲突。
          sudo apt-get install -y --no-install-recommends \
            libwpe-1.0-dev/trixie \
            libwpewebkit-2.0-dev/trixie \
            libwpebackend-fdo-1.0-dev/trixie
          echo "=== Linux WebKit/WPE pkg-config check ==="
          pkg-config --modversion wpe-webkit-2.0 || true
          pkg-config --modversion wpe-webkit-1.1 || true
          pkg-config --modversion wpe-webkit-1.0 || true
          pkg-config --modversion wpebackend-fdo-1.0 || true
          pkg-config --modversion wpe-platform-2.0 || true
          pkg-config --modversion wpe-platform-headless-2.0 || true
          pkg-config --modversion wpe-1.0 || true
          pkg-config --modversion libsecret-1 || true
          pkg-config --modversion wayland-server || true
          flutter config --enable-linux-desktop
          dart pub global activate flutter_distributor
          echo "✓ Linux dependencies and flutter_distributor installed"

      - name: Build
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: ${{ matrix.platform }} ${{ matrix.arch }}
          PLATFORM_KEY: ${{ matrix.build_platform == 'windows' && format('windows-{0}', matrix.arch) || matrix.build_platform == 'macos' && format('macos-{0}', matrix.arch) || matrix.platform }}
        run: |
          CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/progress"
          PAYLOAD=$(node -e '
            const label = process.env.PLATFORM_LABEL || "客户端";
            const payload = {
              request_id: process.env.REQUEST_ID,
              run_id: Number(process.env.RUN_ID || 0),
              run_url: process.env.RUN_URL || "",
              status: "in_progress",
              progress_percent: 35,
              progress_stage: "build",
              progress_text: "",
              progress_detail: {
                key: process.env.PLATFORM_KEY || label,
                label,
                status: "in_progress",
                stage: "build",
                text: ""
              }
            };
            process.stdout.write(JSON.stringify(payload));
          ')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
            -d "$PAYLOAD" || true

          cd source
          echo "=== Build Environment ==="
          echo "Platform: ${{ matrix.platform }}"
          echo "Build platform: ${{ matrix.build_platform }}"
          echo "Arch: ${{ matrix.arch }}"
          echo "Flavor: ${{ matrix.build_flavor }}"
          echo "Flutter target: ${{ matrix.build_target }}"
          echo "IS_STABLE: ${{ env.IS_STABLE }}"
          echo "Current directory: $(pwd)"
          echo ""
          echo "=== Tool Versions ==="
          which flutter && flutter --version || echo "flutter not found"
          which dart && dart --version || echo "dart not found"
          which cargo && cargo --version || echo "cargo not found"
          which go && go version || echo "go not found"
          echo ""

          if [ "${{ matrix.build_platform }}" = "macos" ]; then
            echo "=== macOS Pre-Build Check ==="
            echo "Xcode version:"
            xcodebuild -version
            echo ""
            echo "Available SDKs:"
            xcodebuild -showsdks
            echo ""
            echo "libclash/macos directory (before core build):"
            ls -la ./libclash/macos/ 2>/dev/null || echo "libclash/macos not found yet"
            echo ""
            echo "Xcode project core reference:"
            grep -A2 "RuanjianyunCore\|NexGenCore" ./macos/Runner.xcodeproj/project.pbxproj | head -20 || echo "Core reference not found"
            echo ""
          fi

          if [ "${{ matrix.build_platform }}" = "windows" ]; then
            echo "=== Windows Build Tools ==="
            which cmake && cmake --version || echo "cmake not found"
            which msbuild && msbuild -version || echo "msbuild not found"
            echo "Visual Studio installations:"
            ls -la "/c/Program Files/Microsoft Visual Studio/" 2>/dev/null || echo "VS not found"
            ls -la "/c/Program Files (x86)/Microsoft Visual Studio/" 2>/dev/null || echo "VS x86 not found"
            echo ""
          fi

          echo "=== Checking flutter_distributor ==="
          which flutter_distributor || echo "flutter_distributor not in PATH"
          flutter_distributor --version || echo "flutter_distributor version failed"
          echo ""
          echo "=== Checking ISCC (Inno Setup) ==="
          which ISCC || echo "ISCC not in PATH"
          ls -la "/c/Program Files (x86)/Inno Setup 6/" 2>/dev/null || echo "Inno Setup dir not found"
          echo ""
          run_setup_build() {
            local label="$1"
            shift
            local command=(dart setup.dart "${{ matrix.build_platform }}")
            if [ "$#" -gt 0 ]; then
              command+=("$@")
            fi
            if [ -n "${{ matrix.build_flavor || '' }}" ]; then
              command+=(--flavor "${{ matrix.build_flavor }}")
            fi
            if [ -n "${{ matrix.build_target || '' }}" ]; then
              command+=(--flutter-target "${{ matrix.build_target }}")
            fi
            if [ "${IS_STABLE:-}" = "true" ]; then
              command+=(--env stable)
            fi
            command+=(--version "${{ github.event.inputs.tag }}")

            echo "=== Build Command: $label ==="
            printf 'Running:'
            printf ' %q' "${command[@]}"
            echo ""
            echo ""
            echo "=== Build Output: $label ==="
            set +e
            "${command[@]}" 2>&1 | tee -a build.log
            local exit_code=${PIPESTATUS[0]}
            set -e
            echo ""
            echo "=== Build Exit Code ($label): $exit_code ==="
            return "$exit_code"
          }

          set -o pipefail
          : > build.log
          BUILD_EXIT_CODE=0
          if [ "${{ matrix.platform }}" = "android-tv" ]; then
            run_setup_build "android-tv all-abi" || BUILD_EXIT_CODE=$?
          else
            default_arch_args=()
            if [ -n "${{ matrix.arch || '' }}" ]; then
              default_arch_args=(--arch "${{ matrix.arch }}")
            fi
            run_setup_build "${{ matrix.platform }} ${{ matrix.arch || '' }}" "${default_arch_args[@]}" || BUILD_EXIT_CODE=$?
          fi

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED - Collecting Debug Information ==="
            echo ""
            if [ "${{ matrix.build_platform }}" = "windows" ]; then
              echo "=== CMake Error Logs ==="
              find ./build/windows -name "CMakeError.log" -exec echo "File: {}" \; -exec cat {} \; 2>/dev/null || echo "No CMakeError.log found"
              echo ""

              echo "=== CMake Output Logs ==="
              find ./build/windows -name "CMakeOutput.log" -exec echo "File: {}" \; -exec tail -100 {} \; 2>/dev/null || echo "No CMakeOutput.log found"
              echo ""

              echo "=== MSBuild Error Details ==="
              find ./build/windows -name "*.log" -exec echo "File: {}" \; -exec tail -50 {} \; 2>/dev/null || echo "No MSBuild logs found"
              echo ""

              echo "=== Flutter Build Verbose Output (last 200 lines) ==="
              tail -200 build.log 2>/dev/null || echo "No build log"
              echo ""

              echo "=== Windows Build Directory Structure ==="
              ls -laR ./build/windows/ 2>/dev/null | head -100 || echo "No build directory"
              echo ""
            elif [ "${{ matrix.build_platform }}" = "macos" ]; then
              echo "=== macOS Core File Check ==="
              echo "libclash/macos contents:"
              ls -la ./libclash/macos/ 2>/dev/null || echo "libclash/macos not found"
              echo ""
              echo "libclash/macos/arm64 contents:"
              ls -la ./libclash/macos/arm64/ 2>/dev/null || echo "libclash/macos/arm64 not found"
              echo ""
              echo "libclash/macos/amd64 contents:"
              ls -la ./libclash/macos/amd64/ 2>/dev/null || echo "libclash/macos/amd64 not found"
              echo ""

              echo "=== Xcode Build Logs ==="
              find ./build/macos -name "*.log" -exec echo "File: {}" \; -exec tail -100 {} \; 2>/dev/null || echo "No Xcode logs found"
              echo ""

              echo "=== Flutter Assemble Script Content ==="
              SCRIPT_PATH="./build/macos/Build/Intermediates.noindex/Runner.build/Release/Flutter Assemble.build/Script-33CC111E2044C6BF0003C045.sh"
              if [ -f "$SCRIPT_PATH" ]; then
                cat "$SCRIPT_PATH"
              else
                echo "Script not found at: $SCRIPT_PATH"
                find ./build/macos -name "*.sh" 2>/dev/null | head -10
              fi
              echo ""

              echo "=== DerivedData Logs ==="
              find ~/Library/Developer/Xcode/DerivedData -name "*.log" -mmin -10 2>/dev/null | while read f; do
                echo "=== $f ==="
                tail -50 "$f"
              done || echo "No recent DerivedData logs"
              echo ""

              echo "=== Xcode Build Output (xcactivitylog) ==="
              find ./build/macos -name "*.xcactivitylog" 2>/dev/null | head -5 || echo "No xcactivitylog found"
              echo ""

              echo "=== CocoaPods Status ==="
              cat ./macos/Podfile.lock 2>/dev/null | head -50 || echo "No Podfile.lock"
              echo ""

              echo "=== Flutter Assemble Script Location ==="
              ls -la ./build/macos/Build/Intermediates.noindex/Runner.build/Release/ 2>/dev/null || echo "Build intermediates not found"
              echo ""
            elif [ "${{ matrix.build_platform }}" = "linux" ]; then
              echo "=== Linux Build Directory Structure ==="
              ls -laR ./build/linux/ 2>/dev/null | head -200 || echo "No linux build directory"
              echo ""

              echo "=== Linux Packaging Directory Structure ==="
              ls -laR ./linux/packaging/ 2>/dev/null | head -200 || echo "No linux packaging directory"
              echo ""

              echo "=== Linux Output Files ==="
              find . -type f \( -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) 2>/dev/null | head -50 || echo "No Linux packages found"
              echo ""
            fi

            echo "=== Full Build Log (last 300 lines) ==="
            tail -300 build.log 2>/dev/null || echo "No build log"

            exit $BUILD_EXIT_CODE
          fi

      - name: List dist contents
        if: success() && steps.check.outputs.should_run == 'true'
        run: |
          echo "=== source/dist contents ==="
          ls -la ./source/dist/ 2>/dev/null || echo "source/dist not found or empty"
          find ./source/dist -type f 2>/dev/null || echo "No files in dist"
          echo ""

          if [ "${{ matrix.build_platform }}" = "windows" ]; then
            echo "=== source/build/windows contents ==="
            ls -la ./source/build/windows/ 2>/dev/null || echo "source/build/windows not found"
            echo ""
            echo "=== All exe files in source ==="
            find ./source -name "*.exe" -type f 2>/dev/null | grep -v "build/windows/x64/CMakeFiles" | head -30 || echo "No exe files"
          elif [ "${{ matrix.build_platform }}" = "android" ]; then
            echo "=== source/build/app/outputs contents ==="
            ls -la ./source/build/app/outputs/ 2>/dev/null || echo "source/build/app/outputs not found"
            echo ""
            echo "=== All APK/AAB files in source ==="
            find ./source -name "*.apk" -o -name "*.aab" 2>/dev/null | head -30 || echo "No APK/AAB files"
          elif [ "${{ matrix.build_platform }}" = "linux" ]; then
            echo "=== source/build/linux contents ==="
            ls -la ./source/build/linux/ 2>/dev/null || echo "source/build/linux not found"
            echo ""
            echo "=== All Linux package files in source ==="
            find ./source -type f \( -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) 2>/dev/null | head -30 || echo "No Linux package files"
          fi

          echo ""
          echo "=== Build log tail ==="
          tail -100 ./source/build.log 2>/dev/null || echo "No build log"

      - name: Report Platform Failed
        if: failure() && steps.check.outputs.should_run == 'true'
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: ${{ matrix.platform }} ${{ matrix.arch }}
          PLATFORM_KEY: ${{ matrix.build_platform == 'windows' && format('windows-{0}', matrix.arch) || matrix.build_platform == 'macos' && format('macos-{0}', matrix.arch) || matrix.platform }}
        run: |
          CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/progress"
          PAYLOAD=$(node -e '
            const label = process.env.PLATFORM_LABEL || "客户端";
            const payload = {
              request_id: process.env.REQUEST_ID,
              run_id: Number(process.env.RUN_ID || 0),
              run_url: process.env.RUN_URL || "",
              status: "in_progress",
              progress_percent: 80,
              progress_stage: "build",
              progress_text: "",
              progress_detail: {
                key: process.env.PLATFORM_KEY || label,
                label,
                status: "completed",
                conclusion: "failure",
                stage: "completed",
                text: ""
              }
            };
            process.stdout.write(JSON.stringify(payload));
          ')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
            -d "$PAYLOAD" || true

      - name: Upload dist to Draft Release
        if: success() && steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_UPLOAD_URL: ${{ needs.prepare-release.outputs.upload_url }}
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: ${{ matrix.platform }} ${{ matrix.arch }}
          PLATFORM_KEY: ${{ matrix.build_platform == 'windows' && format('windows-{0}', matrix.arch) || matrix.build_platform == 'macos' && format('macos-{0}', matrix.arch) || matrix.platform }}
        run: |
          report_build_progress() {
            local detail_status="$1"
            local detail_stage="$2"
            local detail_text="$3"
            local detail_conclusion="${4:-}"
            local overall_progress="${5:-75}"
            CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/progress"
            PAYLOAD=$(DETAIL_STATUS="$detail_status" DETAIL_STAGE="$detail_stage" DETAIL_TEXT="$detail_text" DETAIL_CONCLUSION="$detail_conclusion" OVERALL_PROGRESS="$overall_progress" node -e '
              const label = process.env.PLATFORM_LABEL || "客户端";
              const payload = {
                request_id: process.env.REQUEST_ID,
                run_id: Number(process.env.RUN_ID || 0),
                run_url: process.env.RUN_URL || "",
                status: "in_progress",
                progress_percent: Number(process.env.OVERALL_PROGRESS || 75),
                progress_stage: process.env.DETAIL_STAGE || "upload",
                progress_text: "",
                progress_detail: {
                  key: process.env.PLATFORM_KEY || label,
                  label,
                  status: process.env.DETAIL_STATUS || "in_progress",
                  conclusion: process.env.DETAIL_CONCLUSION || "",
                  stage: process.env.DETAIL_STAGE || "",
                  text: process.env.DETAIL_TEXT || ""
                }
              };
              process.stdout.write(JSON.stringify(payload));
            ')
            curl -fsS -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
              -d "$PAYLOAD" || true
          }

          trap 'report_build_progress "completed" "completed" "" "failure" "80"' ERR
          report_build_progress "in_progress" "upload" "" "" "75"

          if [ ! -d "./source/dist" ]; then
            echo "source/dist not found"
            exit 1
          fi

          FILE_COUNT=$(find ./source/dist -type f | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" = "0" ]; then
            echo "No files found in source/dist"
            exit 1
          fi

          ASSETS_RESPONSE=$(curl -sS --fail -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")

          cd ./source/dist
          find . -type f | sort | while IFS= read -r file; do
            [ -n "$file" ] || continue

            ASSET_NAME=$(basename "$file")
            EXISTING_ASSET_ID=$(printf '%s' "$ASSETS_RESPONSE" | node -e "
              const fs = require('fs');
              const assetName = process.argv[1];
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              const asset = (Array.isArray(data) ? data : []).find(item => item && item.name === assetName);
              process.stdout.write(asset ? String(asset.id) : '');
            " "$ASSET_NAME")

            if [ -n "$EXISTING_ASSET_ID" ]; then
              echo "Deleting existing release asset: $ASSET_NAME"
              curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/${EXISTING_ASSET_ID}" > /dev/null
            fi

            ENCODED_FILENAME=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$ASSET_NAME")
            echo "Uploading release asset: $ASSET_NAME"
            UPLOAD_RESPONSE=$(curl -sS --fail --http1.1 --retry 5 --retry-delay 2 --retry-all-errors -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "Expect:" \
              "${RELEASE_UPLOAD_URL}?name=${ENCODED_FILENAME}" \
              --upload-file "$file")

            UPLOADED_ASSET_ID=$(printf '%s' "$UPLOAD_RESPONSE" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.id ? String(data.id) : '');
            ")
            UPLOADED_ASSET_NAME=$(printf '%s' "$UPLOAD_RESPONSE" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.name ? String(data.name) : '');
            ")
            UPLOADED_ASSET_STATE=$(printf '%s' "$UPLOAD_RESPONSE" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.state ? String(data.state) : '');
            ")

            if [ -z "$UPLOADED_ASSET_ID" ] || [ "$UPLOADED_ASSET_NAME" != "$ASSET_NAME" ] || [ "$UPLOADED_ASSET_STATE" != "uploaded" ]; then
              echo "::error::Release asset upload verification failed: $ASSET_NAME"
              echo "$UPLOAD_RESPONSE"
              exit 1
            fi

            echo "Uploaded asset verified: id=$UPLOADED_ASSET_ID state=$UPLOADED_ASSET_STATE name=$UPLOADED_ASSET_NAME"
          done
          report_build_progress "completed" "completed" "" "success" "80"

          echo "=== Release assets after upload ==="
          FINAL_ASSET_COUNT=$(curl -sS --fail -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              const assets = Array.isArray(data) ? data : [];
              for (const asset of assets) {
                console.log([asset.id, asset.name, asset.state, asset.size].join('\t'));
              }
              process.stderr.write(String(assets.length));
            " 2>asset_count.txt)
          cat asset_count.txt
          if [ "$(tr -d '\n\r ' < asset_count.txt)" = "0" ]; then
            echo "::error::Release asset list is empty after upload"
            exit 1
          fi
          printf '%s\n' "$FINAL_ASSET_COUNT"
          rm -f asset_count.txt

  build-linux:
    needs: prepare-release
    if: ${{ github.event.inputs.core != 'xray' }}
    runs-on: ${{ matrix.os }}
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            build_platform: linux
            os: ubuntu-24.04
            arch: amd64
            include_in_all: true
            flutter_channel: stable
            flutter_arch: x64
          - platform: linux
            build_platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            include_in_all: true
            flutter_channel: master
            flutter_arch: arm64

    steps:
      - name: Check if platform should run
        id: check
        run: |
          SELECTED="${{ github.event.inputs.platforms }}"
          CORE="${{ github.event.inputs.core || 'mihomo' }}"
          CURRENT="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"
          SHOULD_RUN="false"

          echo "Selected platforms: $SELECTED"
          echo "Selected core: $CORE"
          echo "Current matrix: platform=$CURRENT, arch=$ARCH"

          if [[ "$SELECTED" == "all" ]]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",$CURRENT,"* ]]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",linux-arm64,"* ]] && [ "$ARCH" = "arm64" ]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",linux-amd64,"* ]] && [ "$ARCH" = "amd64" ]; then
            SHOULD_RUN="true"
          fi

          if [ "$CORE" = "xray" ]; then
            SHOULD_RUN="false"
          fi

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

          if [ "$SHOULD_RUN" = "false" ]; then
            echo "⏭️ Skipping linux ($ARCH) - not selected"
          else
            echo "✅ Building linux ($ARCH)"
          fi

      - name: Bootstrap Linux Container
        if: steps.check.outputs.should_run == 'true'
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            file \
            git \
            jq \
            nodejs \
            openssh-client \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Report Linux Build Started
        if: steps.check.outputs.should_run == 'true'
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: linux ${{ matrix.arch }}
          PLATFORM_KEY: linux-${{ matrix.arch }}
        run: |
          CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/progress"
          PAYLOAD=$(node -e '
            const label = process.env.PLATFORM_LABEL || "Linux";
            const payload = {
              request_id: process.env.REQUEST_ID,
              run_id: Number(process.env.RUN_ID || 0),
              run_url: process.env.RUN_URL || "",
              status: "in_progress",
              progress_percent: 35,
              progress_stage: "build",
              progress_text: "",
              progress_detail: {
                key: process.env.PLATFORM_KEY || label,
                label,
                status: "in_progress",
                stage: "build",
                text: ""
              }
            };
            process.stdout.write(JSON.stringify(payload));
          ')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
            -d "$PAYLOAD" || true

      - name: Clone private repo
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config --global url."https://x-access-token:${{ secrets.WORKFLOW_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.WORKFLOW_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
          CORE="${{ github.event.inputs.core || 'mihomo' }}"
          SOURCE_REPO="${{ env.MIHOMO_SOURCE_REPO }}"
          if [ "$CORE" = "xray" ]; then
            SOURCE_REPO="${{ env.XRAY_SOURCE_REPO }}"
          fi
          echo "Selected core: $CORE"
          echo "Source repo: $SOURCE_REPO"
          git clone "https://x-access-token:${{ secrets.WORKFLOW_TOKEN }}@github.com/${SOURCE_REPO}.git" source
          cd source
          REQUESTED_REF="${{ github.event.inputs.branch }}"
          SOURCE_REF="$REQUESTED_REF"
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="${{ github.event.inputs.tag }}"
          fi
          echo "Requested source ref: ${REQUESTED_REF:-<empty>}"
          echo "Checking out source ref: $SOURCE_REF"
          git checkout "$SOURCE_REF"
          echo "Checked out commit: $(git rev-parse HEAD)"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Apply profile config
        id: config
        if: steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          cd source
          PROFILE_NAME="${{ github.event.inputs.profile }}"
          PROFILE_BRANCH="${{ github.event.inputs.profile_branch }}"
          echo "=== Applying profile: $PROFILE_NAME ==="

          PROFILE_PATH="profiles/$PROFILE_NAME.yaml"
          ENCODED_PROFILE_PATH=$(node -e "console.log(process.argv[1].split('/').map(encodeURIComponent).join('/'))" "$PROFILE_PATH")
          echo "Reading $PROFILE_PATH from ${{ env.PROFILE_REPO }}@$PROFILE_BRANCH..."
          API_RESPONSE=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ env.PROFILE_REPO }}/contents/${ENCODED_PROFILE_PATH}?ref=${PROFILE_BRANCH}")
          if ! echo "$API_RESPONSE" | grep -q '"content"'; then
            echo "Error: Failed to read $PROFILE_PATH from profile repo branch $PROFILE_BRANCH"
            printf "%s" "$API_RESPONSE" | node -e 'const fs=require("fs"); const raw=fs.readFileSync(0,"utf8"); try { const data=JSON.parse(raw); console.log(JSON.stringify({message:data.message||"", status:data.status||"", documentation_url:data.documentation_url||""})); } catch { console.log(String(raw).replace(/https?:\/\/\S+/g,"https://[redacted]").slice(0,1000)); }'
            exit 1
          fi
          printf '%s' "$API_RESPONSE" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf8'));
            process.stdout.write(Buffer.from(String(data.content || '').replace(/\\n/g, ''), 'base64').toString());
          " > assets/config/xboard.config.yaml

          APP_NAME=$(node -e "
            const fs = require('fs');
            const yaml = fs.readFileSync('assets/config/xboard.config.yaml', 'utf8');
            const appBlockMatch = yaml.match(/(?:^|\r?\n)  app:\r?\n((?:    .*?(?:\r?\n|$)|\r?\n)*)/);
            const appTitleMatch = appBlockMatch ? appBlockMatch[1].match(/(?:^|\r?\n)    title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/) : null;
            const rootTitleMatch = yaml.match(/(?:^|\r?\n)  title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/);
            const rawName = appTitleMatch ? appTitleMatch[1].trim() : (rootTitleMatch ? rootTitleMatch[1].trim() : '$PROFILE_NAME');
            const appName = String(rawName || '').replace(/[\\r\\n]+/g, ' ').trim();
            console.log(appName);
          ")

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Successfully applied profile: $PROFILE_NAME, App Name: $APP_NAME"
          echo ""
          echo "=== Config file content (first 30 lines, redacted) ==="
          node - assets/config/xboard.config.yaml 30 <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const limit = Number(process.argv[3] || 30);
          const sensitive = /(token|secret|password|passwd|pwd|key|authorization|cookie|session|decrypt|encrypt|sign|keystore|credential|private|subscription|remote|url|host|domain|api|endpoint|server|panel)/i;
          const lines = fs.readFileSync(file, "utf8").split(/\r?\n/).slice(0, limit).map((line) => {
            const urlRedacted = line.replace(/https?:\/\/[^\s"'<>]+/gi, "https://[redacted]");
            const pair = urlRedacted.match(/^(\s*[^:#\n][^:\n]*:\s*)(.*)$/);
            if (pair && sensitive.test(pair[1])) return `${pair[1]}[redacted]`;
            return urlRedacted;
          });
          console.log(lines.join("\n"));
          NODE

      - name: Setup Go
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache-dependency-path: source/core/go.sum

      - name: Setup Flutter (Linux)
        if: steps.check.outputs.should_run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: "${{ matrix.flutter_channel }}"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          architecture: "${{ matrix.flutter_arch }}"
          cache: true

      - name: Mark Flutter SDK as safe git directory
        if: steps.check.outputs.should_run == 'true'
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$FLUTTER_BIN")")")"
          git config --global --add safe.directory "$FLUTTER_ROOT"
          echo "Configured git safe.directory: $FLUTTER_ROOT"

      - name: Verify Flutter and Dart version
        if: steps.check.outputs.should_run == 'true'
        run: |
          set -euo pipefail

          expected_flutter="${FLUTTER_VERSION}"
          actual_flutter="$(flutter --version | sed -nE 's/^Flutter ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' | head -n 1)"
          dart_version="$(dart --version 2>&1 | sed -nE 's/.*Dart SDK version: ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')"

          if [ -z "$actual_flutter" ] || [ "$actual_flutter" != "$expected_flutter" ]; then
            echo "::error::Flutter 版本不匹配：期望 $expected_flutter，实际 ${actual_flutter:-无法识别}"
            exit 1
          fi

          if [ -z "$dart_version" ]; then
            echo "::error::无法识别 Dart SDK 版本"
            exit 1
          fi

          IFS=. read -r dart_major dart_minor dart_patch <<< "$dart_version"
          if (( dart_major < 3 || (dart_major == 3 && dart_minor < 12) )); then
            echo "::error::Dart SDK 版本过低：$dart_version，源码要求 >= 3.12.0"
            exit 1
          fi

          echo "Flutter 版本校验通过：$actual_flutter"
          echo "Dart SDK 版本校验通过：$dart_version"

      - name: Get Flutter Dependency
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          flutter pub get

      - name: Patch flutter_inappwebview_linux for WebKit < 2.50
        if: steps.check.outputs.should_run == 'true'
        run: |
          PLUGIN_FILE="$(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*flutter_inappwebview_linux-*/linux/in_app_webview/in_app_webview.cc' | head -1)"
          if [ -z "$PLUGIN_FILE" ]; then
            echo "flutter_inappwebview_linux source file not found"
            exit 1
          fi

          echo "Patching plugin file: $PLUGIN_FILE"
          if grep -q 'WEBKIT_CHECK_VERSION(2, 50, 0)' "$PLUGIN_FILE"; then
            echo "Plugin already patched"
          else
            perl -0pi -e 's@std::optional<std::string> InAppWebView::getMetaThemeColor\(\) const \{\n.*?\n  return std::string\(hexColor\);\n\}@std::optional<std::string> InAppWebView::getMetaThemeColor() const {\n  if (webview_ == nullptr) return std::nullopt;\n\n#if !WEBKIT_CHECK_VERSION(2, 50, 0)\n  return std::nullopt;\n#else\n  WebKitColor color;\n  gboolean hasColor = webkit_web_view_get_theme_color(webview_, &color);\n\n  if (!hasColor) {\n    return std::nullopt;\n  }\n\n  // Convert WebKitColor (RGBA in 0.0-1.0 range) to hex string format #RRGGBBAA\n  // Note: WebKitColor has red, green, blue, alpha as gdouble (0.0-1.0)\n  int r = static_cast<int>(color.red * 255.0 + 0.5);\n  int g = static_cast<int>(color.green * 255.0 + 0.5);\n  int b = static_cast<int>(color.blue * 255.0 + 0.5);\n  int a = static_cast<int>(color.alpha * 255.0 + 0.5);\n\n  // Clamp values to 0-255\n  r = std::max(0, std::min(255, r));\n  g = std::max(0, std::min(255, g));\n  b = std::max(0, std::min(255, b));\n  a = std::max(0, std::min(255, a));\n\n  char hexColor[10];\n  if (a == 255) {\n    snprintf(hexColor, sizeof(hexColor), "#%02X%02X%02X", r, g, b);\n  } else {\n    snprintf(hexColor, sizeof(hexColor), "#%02X%02X%02X%02X", r, g, b, a);\n  }\n\n  return std::string(hexColor);\n#endif\n}@s or die "Failed to patch getMetaThemeColor()\n";' "$PLUGIN_FILE"
          fi

          echo "=== Patched getMetaThemeColor snippet ==="
          sed -n '/std::optional<std::string> InAppWebView::getMetaThemeColor() const {/,/int r = static_cast<int>(color.red/p' "$PLUGIN_FILE" | head -40

      - name: Generate Executable Names
        if: steps.check.outputs.should_run == 'true'
        id: executable_names
        run: |
          cd source
          echo "=== Generating Executable Names ==="
          dart run scripts/generate_executable_names.dart
          echo ""
          echo "=== Generated Executable Names ==="
          grep "const String executableAppName" lib/generated/executable_names.dart || true

          PINYIN_NAME=$(grep "const String executableAppName = '" lib/generated/executable_names.dart | sed "s/.*const String executableAppName = '\([^']*\)'.*/\1/")
          echo "profile_name_safe=$PINYIN_NAME" >> $GITHUB_OUTPUT
          echo "Extracted pinyin name: $PINYIN_NAME"

      - name: Generate SDK Code
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source/lib/sdk/flutter_xboard_sdk
          flutter pub get
          dart run build_runner build

      - name: Generate Main Project Code
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          dart run build_runner build

      - name: Generate XBoard Config
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          echo "=== Generating XBoard Config ==="
          dart run tools/generate_config.dart
          echo ""
          echo "=== Generated Config (redacted preview) ==="
          node - lib/xboard/config/core/generated_config.dart 80 <<'NODE'
          const fs = require("fs");
          const file = process.argv[2];
          const limit = Number(process.argv[3] || 80);
          const sensitive = /(token|secret|password|passwd|pwd|key|authorization|cookie|session|decrypt|encrypt|sign|keystore|credential|private|subscription|remote|url|host|domain|api|endpoint|server|panel)/i;
          const lines = fs.readFileSync(file, "utf8").split(/\r?\n/).slice(0, limit).map((line) => {
            let output = line.replace(/https?:\/\/[^\s"',)]+/gi, "https://[redacted]");
            output = output.replace(/((?:token|secret|password|passwd|pwd|key|authorization|cookie|session|decrypt|encrypt|sign|keystore|credential|private|subscription|remote|url|host|domain|api|endpoint|server|panel)[A-Za-z0-9_]*\s*=\s*)(["`])([^"`]*)\2/gi, "$1$2[redacted]$2");
            if (sensitive.test(output) && /(["`]).*\1/.test(output)) {
              output = output.replace(/(["`])([^"`]*)\1/g, "$1[redacted]$1");
            }
            return output;
          });
          console.log(lines.join("\n"));
          NODE
          echo ""
          echo "=== Pubspec Assets Check ==="
          grep -A 10 "assets:" pubspec.yaml || echo "No assets section found"

      - name: Prepare Linux Build Environment
        if: steps.check.outputs.should_run == 'true'
        run: |
          echo "Preparing Linux build environment in Debian trixie container..."
          apt-get update -y
          apt-get install -y --no-install-recommends \
            clang \
            cmake \
            g++ \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libepoxy-dev \
            libsecret-1-dev \
            libwayland-dev \
            libwpe-1.0-dev \
            libwpewebkit-2.0-dev \
            libwpebackend-fdo-1.0-dev \
            libayatana-appindicator3-dev \
            libkeybinder-3.0-dev
          echo "=== Linux WebKit/WPE pkg-config check ==="
          pkg-config --modversion wpe-webkit-2.0 || true
          pkg-config --modversion wpe-webkit-1.1 || true
          pkg-config --modversion wpe-webkit-1.0 || true
          pkg-config --modversion wpebackend-fdo-1.0 || true
          pkg-config --modversion wpe-platform-2.0 || true
          pkg-config --modversion wpe-platform-headless-2.0 || true
          pkg-config --modversion wpe-1.0 || true
          pkg-config --modversion libsecret-1 || true
          pkg-config --modversion wayland-server || true
          echo "CFLAGS=-Wno-error=deprecated-declarations" >> $GITHUB_ENV
          echo "CXXFLAGS=-Wno-error=deprecated-declarations" >> $GITHUB_ENV
          flutter config --enable-linux-desktop
          PUB_CACHE_BIN="${HOME}/.pub-cache/bin"
          echo "$PUB_CACHE_BIN" >> $GITHUB_PATH
          export PATH="$PUB_CACHE_BIN:$PATH"
          dart pub global activate flutter_distributor
          echo "✓ Linux dependencies and flutter_distributor installed"

      - name: Build
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          echo "=== Build Environment ==="
          echo "Platform: linux"
          echo "Arch: ${{ matrix.arch }}"
          echo "IS_STABLE: ${{ env.IS_STABLE }}"
          echo "Current directory: $(pwd)"
          echo ""
          echo "=== Tool Versions ==="
          which flutter && flutter --version || echo "flutter not found"
          which dart && dart --version || echo "dart not found"
          which go && go version || echo "go not found"
          which g++ && g++ --version | head -1 || echo "g++ not found"
          echo "CFLAGS=${CFLAGS:-<empty>}"
          echo "CXXFLAGS=${CXXFLAGS:-<empty>}"
          which flutter_distributor && flutter_distributor --version || echo "flutter_distributor not found"
          echo ""
          echo "=== Build Command ==="
          echo "Running: dart setup.dart linux --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --version ${{ github.event.inputs.tag }}"
          echo ""
          echo "=== Build Output ==="
          set -o pipefail
          dart setup.dart linux --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --version ${{ github.event.inputs.tag }} 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Build Exit Code: $BUILD_EXIT_CODE ==="

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED - Collecting Debug Information ==="
            echo "=== Linux Build Directory Structure ==="
            ls -laR ./build/linux/ 2>/dev/null | head -200 || echo "No linux build directory"
            echo ""
            echo "=== Linux Packaging Directory Structure ==="
            ls -laR ./linux/packaging/ 2>/dev/null | head -200 || echo "No linux packaging directory"
            echo ""
            echo "=== Linux Output Files ==="
            find . -type f \( -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) 2>/dev/null | head -50 || echo "No Linux packages found"
            echo ""
            echo "=== Full Build Log (last 300 lines) ==="
            tail -300 build.log 2>/dev/null || echo "No build log"
            exit $BUILD_EXIT_CODE
          fi

      - name: List dist contents
        if: success() && steps.check.outputs.should_run == 'true'
        run: |
          echo "=== source/dist contents ==="
          ls -la ./source/dist/ 2>/dev/null || echo "source/dist not found or empty"
          find ./source/dist -type f 2>/dev/null || echo "No files in dist"
          echo ""
          echo "=== source/build/linux contents ==="
          ls -la ./source/build/linux/ 2>/dev/null || echo "source/build/linux not found"
          echo ""
          echo "=== All Linux package files in source ==="
          find ./source -type f \( -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) 2>/dev/null | head -30 || echo "No Linux package files"
          echo ""
          echo "=== Build log tail ==="
          tail -100 ./source/build.log 2>/dev/null || echo "No build log"

      - name: Report Linux Platform Failed
        if: failure() && steps.check.outputs.should_run == 'true'
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: linux ${{ matrix.arch }}
          PLATFORM_KEY: linux-${{ matrix.arch }}
        run: |
          CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/progress"
          PAYLOAD=$(node -e '
            const label = process.env.PLATFORM_LABEL || "Linux";
            const payload = {
              request_id: process.env.REQUEST_ID,
              run_id: Number(process.env.RUN_ID || 0),
              run_url: process.env.RUN_URL || "",
              status: "in_progress",
              progress_percent: 80,
              progress_stage: "build",
              progress_text: "",
              progress_detail: {
                key: process.env.PLATFORM_KEY || label,
                label,
                status: "completed",
                conclusion: "failure",
                stage: "completed",
                text: ""
              }
            };
            process.stdout.write(JSON.stringify(payload));
          ')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
            -d "$PAYLOAD" || true

      - name: Upload dist to Draft Release
        if: success() && steps.check.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_UPLOAD_URL: ${{ needs.prepare-release.outputs.upload_url }}
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PLATFORM_LABEL: linux ${{ matrix.arch }}
          PLATFORM_KEY: linux-${{ matrix.arch }}
        run: |
          report_build_progress() {
            local detail_status="$1"
            local detail_stage="$2"
            local detail_text="$3"
            local detail_conclusion="${4:-}"
            local overall_progress="${5:-75}"
            CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/progress"
            PAYLOAD=$(DETAIL_STATUS="$detail_status" DETAIL_STAGE="$detail_stage" DETAIL_TEXT="$detail_text" DETAIL_CONCLUSION="$detail_conclusion" OVERALL_PROGRESS="$overall_progress" node -e '
              const label = process.env.PLATFORM_LABEL || "Linux";
              const payload = {
                request_id: process.env.REQUEST_ID,
                run_id: Number(process.env.RUN_ID || 0),
                run_url: process.env.RUN_URL || "",
                status: "in_progress",
                progress_percent: Number(process.env.OVERALL_PROGRESS || 75),
                progress_stage: process.env.DETAIL_STAGE || "upload",
                progress_text: "",
                progress_detail: {
                  key: process.env.PLATFORM_KEY || label,
                  label,
                  status: process.env.DETAIL_STATUS || "in_progress",
                  conclusion: process.env.DETAIL_CONCLUSION || "",
                  stage: process.env.DETAIL_STAGE || "",
                  text: process.env.DETAIL_TEXT || ""
                }
              };
              process.stdout.write(JSON.stringify(payload));
            ')
            curl -fsS -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
              -d "$PAYLOAD" || true
          }

          trap 'report_build_progress "completed" "completed" "" "failure" "80"' ERR
          report_build_progress "in_progress" "upload" "" "" "75"

          if [ ! -d "./source/dist" ]; then
            echo "source/dist not found"
            exit 1
          fi

          FILE_COUNT=$(find ./source/dist -type f | wc -l | tr -d ' ')
          if [ "$FILE_COUNT" = "0" ]; then
            echo "No files found in source/dist"
            exit 1
          fi

          ASSETS_RESPONSE=$(curl -sS --fail -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")

          cd ./source/dist
          find . -type f | sort | while IFS= read -r file; do
            [ -n "$file" ] || continue

            ASSET_NAME=$(basename "$file")
            EXISTING_ASSET_ID=$(printf '%s' "$ASSETS_RESPONSE" | node -e "
              const fs = require('fs');
              const assetName = process.argv[1];
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              const asset = (Array.isArray(data) ? data : []).find(item => item && item.name === assetName);
              process.stdout.write(asset ? String(asset.id) : '');
            " "$ASSET_NAME")

            if [ -n "$EXISTING_ASSET_ID" ]; then
              echo "Deleting existing release asset: $ASSET_NAME"
              curl -s -X DELETE -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/releases/assets/${EXISTING_ASSET_ID}" > /dev/null
            fi

            ENCODED_FILENAME=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$ASSET_NAME")
            echo "Uploading release asset: $ASSET_NAME"
            UPLOAD_RESPONSE=$(curl -sS --fail --http1.1 --retry 5 --retry-delay 2 --retry-all-errors -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              -H "Expect:" \
              "${RELEASE_UPLOAD_URL}?name=${ENCODED_FILENAME}" \
              --upload-file "$file")

            UPLOADED_ASSET_ID=$(printf '%s' "$UPLOAD_RESPONSE" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.id ? String(data.id) : '');
            ")
            UPLOADED_ASSET_NAME=$(printf '%s' "$UPLOAD_RESPONSE" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.name ? String(data.name) : '');
            ")
            UPLOADED_ASSET_STATE=$(printf '%s' "$UPLOAD_RESPONSE" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.state ? String(data.state) : '');
            ")

            if [ -z "$UPLOADED_ASSET_ID" ] || [ "$UPLOADED_ASSET_NAME" != "$ASSET_NAME" ] || [ "$UPLOADED_ASSET_STATE" != "uploaded" ]; then
              echo "::error::Release asset upload verification failed: $ASSET_NAME"
              echo "$UPLOAD_RESPONSE"
              exit 1
            fi

            echo "Uploaded asset verified: id=$UPLOADED_ASSET_ID state=$UPLOADED_ASSET_STATE name=$UPLOADED_ASSET_NAME"
          done
          report_build_progress "completed" "completed" "" "success" "80"

          echo "=== Release assets after upload ==="
          FINAL_ASSET_COUNT=$(curl -sS --fail -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              const assets = Array.isArray(data) ? data : [];
              for (const asset of assets) {
                console.log([asset.id, asset.name, asset.state, asset.size].join('\t'));
              }
              process.stderr.write(String(assets.length));
            " 2>asset_count.txt)
          cat asset_count.txt
          if [ "$(tr -d '\n\r ' < asset_count.txt)" = "0" ]; then
            echo "::error::Release asset list is empty after upload"
            exit 1
          fi
          printf '%s\n' "$FINAL_ASSET_COUNT"
          rm -f asset_count.txt

  # 从 Draft Release 汇总所有平台产物并回传合集包
  merge-artifacts:
    runs-on: ubuntu-latest
    needs: [ prepare-release, build, build-linux ]
    if: ${{ !cancelled() && needs.build.result == 'success' && (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') }}
    steps:
      - name: Report Bundle Started
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/progress"
          PAYLOAD=$(node -e '
            const payload = {
              request_id: process.env.REQUEST_ID,
              run_id: Number(process.env.RUN_ID || 0),
              run_url: process.env.RUN_URL || "",
              status: "in_progress",
              progress_percent: 85,
              progress_stage: "bundle",
              progress_text: "正在整理合集包并更新 Release 产物"
            };
            process.stdout.write(JSON.stringify(payload));
          ')
          curl -fsS -X POST "$CALLBACK_URL" \
            -H "Content-Type: application/json" \
            -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
            -d "$PAYLOAD" || true

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
        run: |
          mkdir -p ./dist

          ASSETS_RESPONSE=$(curl -sS --fail -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")

          printf '%s' "$ASSETS_RESPONSE" | node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync(0, 'utf8'));
            const assets = (Array.isArray(data) ? data : [])
              .filter(item => item && item.id && item.name && !item.name.endsWith('-bundle.zip'));
            for (const asset of assets) {
              process.stdout.write(String(asset.id) + '\t' + asset.name + '\n');
            }
          " | while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_id" ] || continue
            echo "Downloading release asset: $asset_name"
            curl -L -sS --fail \
              -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${asset_id}" \
              -o "./dist/${asset_name}"
          done

      - name: Check artifacts
        id: check
        run: |
          if [ -d "./dist" ] && [ "$(ls -A ./dist 2>/dev/null)" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            echo "Found artifacts:"
            ls -la ./dist/

            # 从构建产物文件名中提取拼音应用名称
            # 例如：Qieyun-1.0.0-android-arm64-v8a.apk -> Qieyun
            FIRST_FILE=$(find ./dist -type f \( -iname "*.apk" -o -iname "*.dmg" -o -iname "*.exe" -o -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) | head -1)
            if [ -n "$FIRST_FILE" ]; then
              FILENAME=$(basename "$FIRST_FILE")
              # 提取第一个 - 之前的部分作为拼音应用名称
              PINYIN_NAME=$(echo "$FILENAME" | sed 's/-.*$//')
              echo "profile_name_safe=$PINYIN_NAME" >> $GITHUB_OUTPUT
              echo "Extracted pinyin name: $PINYIN_NAME"
            else
              echo "profile_name_safe=app" >> $GITHUB_OUTPUT
              echo "No suitable file found, using default name"
            fi
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "No artifacts found"
          fi

      - name: Generate sha256
        if: steps.check.outputs.has_artifacts == 'true'
        run: |
          cd ./dist
          for file in $(find . -type f -not -name "*.sha256"); do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Package merged bundle
        if: steps.check.outputs.has_artifacts == 'true'
        id: package
        run: |
          PROFILE_NAME_SAFE="${{ steps.check.outputs.profile_name_safe }}"
          VERSION="${{ github.event.inputs.tag }}"
          PACKAGE_NAME="${PROFILE_NAME_SAFE}-${VERSION}-bundle.zip"

          mkdir -p ./release
          cd ./dist
          zip -r "../release/${PACKAGE_NAME}" . -x "*.DS_Store"

          echo "package_name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          echo "package_path=./release/${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Created bundle: ./release/${PACKAGE_NAME}"

      - name: Upload merged bundle to Draft Release
        if: steps.check.outputs.has_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release_id }}
          RELEASE_UPLOAD_URL: ${{ needs.prepare-release.outputs.upload_url }}
        run: |
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"
          ASSETS_RESPONSE=$(curl -sS --fail -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets")
          printf '%s' "$ASSETS_RESPONSE" | node -e '
            const fs = require("fs");
            const packageName = process.argv[1];
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            const zipPartPrefix = `${packageName.replace(/\.zip$/i, "")}.z`;
            const assets = (Array.isArray(data) ? data : []).filter((item) => {
              const name = String((item && item.name) || "");
              return item && item.id && (
                name === packageName ||
                name === `${packageName}.sha256` ||
                name === `${packageName}.manifest.txt` ||
                name.startsWith(`${packageName}.part-`) ||
                (name.startsWith(zipPartPrefix) && /^\d+$/.test(name.slice(zipPartPrefix.length)))
              );
            });
            for (const asset of assets) {
              process.stdout.write(`${asset.id}\t${asset.name}\n`);
            }
          ' "$PACKAGE_NAME" | while IFS=$'\t' read -r asset_id asset_name; do
            [ -n "$asset_id" ] || continue
            echo "Deleting existing bundle asset: $asset_name"
            curl -sS --fail -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/assets/${asset_id}" > /dev/null
          done

          cd ./release
          BUNDLE_PART_BYTES=$((1024 * 1024 * 1024))
          BUNDLE_PART_SIZE="1024m"
          FILESIZE=$(du -h "$PACKAGE_NAME" | cut -f1)
          PACKAGE_BYTES=$(wc -c < "$PACKAGE_NAME" | tr -d ' ')
          UPLOAD_DIR="./upload"
          rm -rf "$UPLOAD_DIR"
          mkdir -p "$UPLOAD_DIR"

          if [ "$PACKAGE_BYTES" -gt "$BUNDLE_PART_BYTES" ]; then
            echo "::notice::合集包 $PACKAGE_NAME 大小为 $FILESIZE，超过 1 GiB，将生成 ZIP 分卷上传。"
            zip -s "$BUNDLE_PART_SIZE" "$PACKAGE_NAME" --out "$UPLOAD_DIR/$PACKAGE_NAME"
            {
              printf '%s 已按 1 GiB 生成 ZIP 分卷上传。\n\n' "$PACKAGE_NAME"
              printf '下载同名前缀的 .z01/.z02/... 和 .zip 到同一目录，然后打开 .zip 解压。\n'
              printf 'Windows 推荐 7-Zip/WinRAR，macOS 推荐 Keka/The Unarchiver。\n'
              printf '校验命令:\n'
              printf 'sha256sum -c %s.sha256\n' "$PACKAGE_NAME"
            } > "$UPLOAD_DIR/${PACKAGE_NAME}.manifest.txt"
          else
            echo "::notice::合集包 $PACKAGE_NAME 大小为 $FILESIZE，未超过 1 GiB，将直接上传完整 zip。"
            cp "$PACKAGE_NAME" "$UPLOAD_DIR/$PACKAGE_NAME"
          fi
          (
            cd "$UPLOAD_DIR"
            find . -maxdepth 1 -type f ! -name "*.sha256" -print0 | sort -z | xargs -0 sha256sum > "${PACKAGE_NAME}.sha256"
          )

          upload_release_asset() {
            local file_path="$1"
            local asset_name
            asset_name="$(basename "$file_path")"
            local content_type="application/octet-stream"
            case "$asset_name" in
              *.zip) content_type="application/zip" ;;
              *.txt|*.sha256) content_type="text/plain; charset=utf-8" ;;
            esac
            local filesize
            filesize=$(du -h "$file_path" | cut -f1)
            local encoded_name
            encoded_name=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$asset_name")

            echo "Uploading merged bundle asset: $asset_name ($filesize)"
            local upload_response
            upload_response=$(curl --fail --http1.1 --retry 5 --retry-delay 2 --retry-all-errors \
              --connect-timeout 30 --max-time 1800 --speed-time 300 --speed-limit 1024 \
              --progress-bar -X POST \
              -H "Authorization: token $GH_TOKEN" \
              -H "Content-Type: $content_type" \
              -H "Expect:" \
              "${RELEASE_UPLOAD_URL}?name=${encoded_name}" \
              --upload-file "$file_path")

            local uploaded_asset_id uploaded_asset_name uploaded_asset_state
            uploaded_asset_id=$(printf '%s' "$upload_response" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.id ? String(data.id) : '');
            ")
            uploaded_asset_name=$(printf '%s' "$upload_response" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.name ? String(data.name) : '');
            ")
            uploaded_asset_state=$(printf '%s' "$upload_response" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              process.stdout.write(data && data.state ? String(data.state) : '');
            ")

            if [ -z "$uploaded_asset_id" ] || [ "$uploaded_asset_name" != "$asset_name" ] || [ "$uploaded_asset_state" != "uploaded" ]; then
              echo "::error::Merged bundle upload verification failed: $asset_name"
              echo "$upload_response"
              exit 1
            fi
            echo "Uploaded merged bundle asset verified: id=$uploaded_asset_id state=$uploaded_asset_state name=$uploaded_asset_name"
          }

          while IFS= read -r upload_file; do
            [ -n "$upload_file" ] || continue
            upload_release_asset "$upload_file"
          done < <(find "$UPLOAD_DIR" -maxdepth 1 -type f | sort)

          echo "=== Release assets after merged bundle upload ==="
          curl -sS --fail -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" | node -e "
              const fs = require('fs');
              const data = JSON.parse(fs.readFileSync(0, 'utf8'));
              const assets = Array.isArray(data) ? data : [];
              for (const asset of assets) {
                console.log([asset.id, asset.name, asset.state, asset.size].join('\t'));
              }
            "

          echo "Draft release updated successfully!"
          echo "View at: https://github.com/${{ github.repository }}/releases"

  notify-build-complete:
    runs-on: ubuntu-latest
    needs: [ prepare-release, build, build-linux, merge-artifacts ]
    if: ${{ always() }}
    steps:
      - name: Complete Build Record
        env:
          CONFIG_SERVER_URL: ${{ secrets.CONFIG_SERVER_URL }}
          CONFIG_SERVER_EVENT_TOKEN: ${{ secrets.CONFIG_SERVER_EVENT_TOKEN }}
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.release_tag }}
          PREPARE_RESULT: ${{ needs.prepare-release.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_LINUX_RESULT: ${{ needs.build-linux.result }}
          MERGE_RESULT: ${{ needs.merge-artifacts.result }}
        run: |
          if [ -z "$REQUEST_ID" ]; then
            echo "::error::缺少 request_id，无法回写打包完成状态。"
            exit 1
          fi
          if [ -z "$CONFIG_SERVER_URL" ]; then
            echo "::error::缺少 GitHub Actions secret: CONFIG_SERVER_URL"
            exit 1
          fi
          if [ -z "$CONFIG_SERVER_EVENT_TOKEN" ]; then
            echo "::error::缺少 GitHub Actions secret: CONFIG_SERVER_EVENT_TOKEN"
            exit 1
          fi

          CONCLUSION="success"
          if [ "$PREPARE_RESULT" = "failure" ] || [ "$BUILD_RESULT" = "failure" ] || [ "$BUILD_LINUX_RESULT" = "failure" ] || [ "$MERGE_RESULT" = "failure" ]; then
            CONCLUSION="failure"
          elif [ "$PREPARE_RESULT" = "cancelled" ] || [ "$BUILD_RESULT" = "cancelled" ] || [ "$BUILD_LINUX_RESULT" = "cancelled" ] || [ "$MERGE_RESULT" = "cancelled" ]; then
            CONCLUSION="cancelled"
          fi

          CALLBACK_URL="${CONFIG_SERVER_URL%/}/api/internal/build-events/complete"
          PAYLOAD=$(CONCLUSION="$CONCLUSION" node -e '
            const payload = {
              request_id: process.env.REQUEST_ID,
              run_id: Number(process.env.RUN_ID || 0),
              run_url: process.env.RUN_URL || "",
              status: "completed",
              conclusion: process.env.CONCLUSION || "",
              release_tag: process.env.RELEASE_TAG || "",
              progress_percent: 100,
              progress_stage: "completed",
              progress_text: ""
            };
            process.stdout.write(JSON.stringify(payload));
          ')

          MAX_ATTEMPTS=5
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            RESPONSE_FILE="$(mktemp)"
            HTTP_CODE="000"
            CURL_EXIT=0
            HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X POST "$CALLBACK_URL" \
              -H "Content-Type: application/json" \
              -H "X-Build-Event-Token: $CONFIG_SERVER_EVENT_TOKEN" \
              -d "$PAYLOAD") || CURL_EXIT=$?

            if [ "$CURL_EXIT" -eq 0 ] && [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              rm -f "$RESPONSE_FILE"
              break
            fi

            echo "::warning::同步打包完成状态失败，第 ${ATTEMPT}/${MAX_ATTEMPTS} 次，curl_exit=${CURL_EXIT}，HTTP ${HTTP_CODE:-000}"
            if [ -s "$RESPONSE_FILE" ]; then
              node -e 'const fs=require("fs"); const raw=fs.readFileSync(process.argv[1],"utf8"); const redacted=String(raw).replace(/https?:\/\/\S+/g,"https://[redacted]").replace(/([A-Za-z0-9_.-]*(?:token|secret|password|passwd|pwd|key|authorization|cookie|session)[A-Za-z0-9_.-]*\s*[:=]\s*)[^\s,}]+/gi,"$1[redacted]").slice(0,2000); console.log(redacted);' "$RESPONSE_FILE"
            fi
            rm -f "$RESPONSE_FILE"

            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::同步打包完成状态失败，已重试 ${MAX_ATTEMPTS} 次。"
              exit 1
            fi

            SLEEP_SECONDS=$((ATTEMPT * 10))
            echo "等待 ${SLEEP_SECONDS}s 后重试完成状态回写..."
            sleep "$SLEEP_SECONDS"
            ATTEMPT=$((ATTEMPT + 1))
          done
