name: build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '配置档案名称（对应 main 分支 profiles 目录中的 YAML 档案名）'
        required: true
        type: string
      tag:
        description: '构建版本号/产物标签（用于 setup.dart --version 和产物命名，例如 v0.1.0）'
        required: true
        type: string
      branch:
        description: '源码分支（如: main, feature/sspanel）'
        required: false
        type: string
        default: 'main'
      platforms:
        description: '选择要编译的平台（多选用逗号分隔，如: windows,android 或 linux-amd64）'
        required: true
        type: string
        default: 'all'
        # 可选值: all, windows, android, android-tv, linux, linux-arm64, linux-amd64, macos-arm64, macos-amd64
        # 注意: all 包含 android-tv、linux 双架构和 macos 双架构
        # 示例: windows,android 或 linux-amd64,macos-arm64
      request_id:
        description: '构建请求唯一标识（由配置服务器生成，用于匹配本次构建运行）'
        required: false
        type: string

concurrency:
  group: build-${{ github.event.inputs.profile }}
  cancel-in-progress: false

env:
  IS_STABLE: ${{ !contains(github.event.inputs.tag, '-') }}
  PRIVATE_REPO: q42602736/Xboard-Mihomo_sub
  FLUTTER_VERSION: "3.41.4"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: windows
            build_platform: windows
            os: Windows-2022
            arch: amd64
            include_in_all: true
          - platform: android
            build_platform: android
            build_flavor: mobile
            os: ubuntu-latest
            # 显式固定 mobile flavor，避免 all 把 tv 产物一起打出来
            include_in_all: true
          - platform: android-tv
            build_platform: android
            build_flavor: tv
            build_target: lib/main_tv.dart
            os: ubuntu-latest
            include_in_all: true
          - platform: macos
            build_platform: macos
            os: macos-latest
            arch: arm64
            include_in_all: true
          - platform: macos
            build_platform: macos
            os: macos-15-intel
            arch: amd64
            include_in_all: true

    steps:
      - name: Check if platform should run
        id: check
        run: |
          SELECTED="${{ github.event.inputs.platforms }}"
          CURRENT="${{ matrix.platform }}"
          BUILD_PLATFORM="${{ matrix.build_platform }}"
          ARCH="${{ matrix.arch }}"
          INCLUDE_IN_ALL="${{ matrix.include_in_all }}"
          
          echo "Selected platforms: $SELECTED"
          echo "Current matrix: platform=$CURRENT, build_platform=$BUILD_PLATFORM, arch=$ARCH"
          
          SHOULD_RUN="false"
          
          # 检查是否选择了 all
          if [[ "$SELECTED" == "all" ]] && [ "$INCLUDE_IN_ALL" = "true" ]; then
            SHOULD_RUN="true"
          # 检查是否包含当前平台
          elif [[ ",$SELECTED," == *",$CURRENT,"* ]]; then
            SHOULD_RUN="true"
          # macOS 特殊处理
          elif [[ ",$SELECTED," == *",macos-arm64,"* ]] && [ "$CURRENT" = "macos" ] && [ "$ARCH" = "arm64" ]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",macos-amd64,"* ]] && [ "$CURRENT" = "macos" ] && [ "$ARCH" = "amd64" ]; then
            SHOULD_RUN="true"
          # Linux 特殊处理
          elif [[ ",$SELECTED," == *",linux-arm64,"* ]] && [ "$CURRENT" = "linux" ] && [ "$ARCH" = "arm64" ]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",linux-amd64,"* ]] && [ "$CURRENT" = "linux" ] && [ "$ARCH" = "amd64" ]; then
            SHOULD_RUN="true"
          fi
          
          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          
          if [ "$SHOULD_RUN" = "false" ]; then
            echo "⏭️ Skipping $CURRENT ($ARCH) - not selected"
          else
            echo "✅ Building $CURRENT ($ARCH)"
          fi

      - name: Free Disk Space (Android)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: false  # 保留Android SDK
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Additional Disk Cleanup (Android)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        run: |
          echo "=== 额外清理磁盘空间 ==="
          df -h

          # 清理Android SDK不需要的部分（保留NDK，构建需要）
          sudo rm -rf /usr/local/lib/android/sdk/build-tools/3[0-3]*
          sudo rm -rf /usr/local/lib/android/sdk/platforms/android-3[0-3]
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /usr/local/lib/android/sdk/emulator

          echo ""
          echo "清理后磁盘使用情况:"
          df -h

      - name: Setup SSH
        if: steps.check.outputs.should_run == 'true'
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Clone private repo
        if: steps.check.outputs.should_run == 'true'
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git clone git@github.com:${{ env.PRIVATE_REPO }}.git source
          cd source
          REQUESTED_REF="${{ github.event.inputs.branch }}"
          SOURCE_REF="$REQUESTED_REF"
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="${{ github.event.inputs.tag }}"
          fi
          echo "Requested source ref: ${REQUESTED_REF:-<empty>}"
          echo "Checking out source ref: $SOURCE_REF"
          git checkout "$SOURCE_REF"
          echo "Checked out commit: $(git rev-parse HEAD)"
          git submodule update --init --recursive

      - name: Apply profile config
        id: config
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          PROFILE_NAME="${{ github.event.inputs.profile }}"
          echo "=== Applying profile: $PROFILE_NAME ==="
          
          # 从 main 分支读取 YAML 配置档案（确保所有分支都能使用最新档案）
          PROFILE_PATH="profiles/$PROFILE_NAME.yaml"
          echo "Reading $PROFILE_PATH from main branch..."
          if ! git show "main:$PROFILE_PATH" > assets/config/xboard.config.yaml; then
            echo "Error: Failed to read $PROFILE_PATH from main branch"
            exit 1
          fi
          
          # 使用 node 提取应用名称（清理换行，避免污染 GITHUB_OUTPUT）
          APP_NAME=$(node -e "
            const fs = require('fs');
            const yaml = fs.readFileSync('assets/config/xboard.config.yaml', 'utf8');
            const appBlockMatch = yaml.match(/(?:^|\r?\n)  app:\r?\n((?:    .*?(?:\r?\n|$)|\r?\n)*)/);
            const appTitleMatch = appBlockMatch ? appBlockMatch[1].match(/(?:^|\r?\n)    title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/) : null;
            const rootTitleMatch = yaml.match(/(?:^|\r?\n)  title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/);
            const rawName = appTitleMatch ? appTitleMatch[1].trim() : (rootTitleMatch ? rootTitleMatch[1].trim() : '$PROFILE_NAME');
            const appName = String(rawName || '').replace(/[\\r\\n]+/g, ' ').trim();
            console.log(appName);
          ")
          
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Successfully applied profile: $PROFILE_NAME, App Name: $APP_NAME"
          
          echo ""
          echo "=== Config file content (first 30 lines) ==="
          head -30 assets/config/xboard.config.yaml

      - name: Setup Android Signing
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > source/android/app/keystore.jks
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> source/android/local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> source/android/local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> source/android/local.properties

      - name: Setup Windows Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows'
        shell: bash
        run: |
          # 创建持久化工具目录
          TOOLS_DIR="/c/runner-tools"
          mkdir -p "$TOOLS_DIR"

          # 检查并安装jq
          if command -v jq &> /dev/null; then
            echo "✓ jq already available"
          else
            echo "Installing jq..."
            choco install jq -y --no-progress || true
            export PATH="/c/ProgramData/chocolatey/bin:$PATH"
            echo "/c/ProgramData/chocolatey/bin" >> $GITHUB_PATH
          fi

          # 检查并安装Inno Setup
          INNO_SETUP_PATH="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ -f "$INNO_SETUP_PATH" ]; then
            echo "✓ Inno Setup already available"
          else
            echo "Installing Inno Setup..."
            choco install innosetup -y --no-progress
            echo "/c/Program Files (x86)/Inno Setup 6" >> $GITHUB_PATH
          fi

          # 设置 CMake 参数以忽略 CMP0175 策略警告
          # 修复 flutter_inappwebview_windows 插件与新版 CMake 的兼容性问题
          echo "CMAKE_ARGS=-Wno-dev" >> $GITHUB_ENV
          echo "✓ CMake configured to ignore policy warnings"

      - name: Setup Rust (x64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows' && matrix.arch == 'amd64'
        shell: bash
        run: |
          if ! command -v cargo &> /dev/null; then
            echo "Installing Rust for x64..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            source "$HOME/.cargo/env"
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          else
            echo "✓ Rust/Cargo already available"
          fi
          cargo --version

      - name: Setup Go
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: source/core/go.sum

      - name: Setup Flutter (Windows x64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows' && matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          cache: true

      - name: Setup Flutter (Android)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          cache: true

      - name: Setup Flutter (macOS)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'macos'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          cache: true

      - name: Setup Flutter (Linux amd64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'linux' && matrix.arch == 'amd64'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          architecture: "x64"
          cache: true

      - name: Setup Flutter (Linux arm64)
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'linux' && matrix.arch == 'arm64'
        uses: subosito/flutter-action@v2
        with:
          # Flutter 官方 Linux manifest 当前只提供 x64 条目，
          # arm64 需改走 git tag 安装，避免 setup.sh 按 manifest 架构过滤失败。
          channel: "master"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          architecture: "arm64"
          cache: true

      - name: Get Flutter Dependency
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          flutter pub get

      - name: Generate Executable Names
        if: steps.check.outputs.should_run == 'true'
        id: executable_names
        run: |
          cd source
          echo "=== Generating Executable Names ==="
          dart run scripts/generate_executable_names.dart
          echo ""
          echo "=== Generated Executable Names ==="
          cat lib/generated/executable_names.dart
          
          # 从生成的文件中提取拼音应用名称
          PINYIN_NAME=$(grep "const String executableAppName = '" lib/generated/executable_names.dart | sed "s/.*const String executableAppName = '\([^']*\)'.*/\1/")
          echo "profile_name_safe=$PINYIN_NAME" >> $GITHUB_OUTPUT
          echo "Extracted pinyin name: $PINYIN_NAME"

      - name: Generate SDK Code
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source/lib/sdk/flutter_xboard_sdk
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate Main Project Code
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate XBoard Config
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          echo "=== Generating XBoard Config ==="
          dart run tools/generate_config.dart
          echo ""
          echo "=== Generated Config ==="
          cat lib/xboard/config/core/generated_config.dart
          echo ""
          echo "=== Pubspec Assets Check ==="
          grep -A 10 "assets:" pubspec.yaml || echo "No assets section found"

      - name: Prepare Windows Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows'
        shell: bash
        run: |
          # 确保PATH包含Pub Cache bin和Inno Setup
          PUB_CACHE_BIN="/c/Users/$(whoami)/AppData/Local/Pub/Cache/bin"
          INNO_SETUP_DIR="/c/Program Files (x86)/Inno Setup 6"
          export PATH="$PUB_CACHE_BIN:$INNO_SETUP_DIR:$PATH"
          echo "$PUB_CACHE_BIN" >> $GITHUB_PATH
          echo "$INNO_SETUP_DIR" >> $GITHUB_PATH

          # 安装 flutter_distributor
          dart pub global activate flutter_distributor
          echo "✓ flutter_distributor installed"

      - name: Clean Windows Build Cache
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'windows'
        shell: bash
        run: |
          echo "🧹 清理 Windows 构建缓存（解决 CMake 安装问题）..."
          cd source
          # 删除 build/windows 目录（如果存在），确保干净构建
          rm -rf build/windows
          # 设置 CMake 策略环境变量，解决 flutter_inappwebview_windows 插件兼容性问题
          echo "CMAKE_POLICY_DEFAULT_CMP0175=OLD" >> $GITHUB_ENV
          # 忽略 CMake 开发者警告
          echo "CMAKE_NO_WARN_DEV=ON" >> $GITHUB_ENV
          echo "✓ 构建缓存已清理，CMake 策略已配置"

      - name: Prepare Android Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'android'
        run: |
          echo "Preparing Android build environment..."
          # 安装 flutter_distributor
          dart pub global activate flutter_distributor
          echo "✓ flutter_distributor installed"

      - name: Prepare macOS Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'macos'
        run: |
          echo "Preparing macOS build environment..."
          
          # 安装 flutter_distributor
          dart pub global activate flutter_distributor
          echo "✓ flutter_distributor installed"
          
          # 安装 appdmg (用于生成 DMG)
          npm install -g appdmg
          echo "✓ appdmg installed"
          
          # 运行 pod install
          cd source/macos
          pod install --repo-update
          echo "✓ CocoaPods dependencies installed"

      - name: Prepare Linux Build Environment
        if: steps.check.outputs.should_run == 'true' && matrix.build_platform == 'linux'
        run: |
          echo "Preparing Linux build environment..."
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libepoxy-dev \
            libsecret-1-dev \
            libwayland-dev \
            libayatana-appindicator3-dev \
            libkeybinder-3.0-dev \
            curl \
            wget \
            xz-utils \
            zip \
            unzip \
            file \
            debian-archive-keyring
          # Ubuntu 24.04 已移除旧的 WPE 1.0 开发包，而 Ubuntu 22.04 的 WebKit API
          # 又不足以编译 flutter_inappwebview_linux。这里只额外引入 Debian trixie
          # 的 WPE 2.0 相关包，避免整套基础环境大范围切换发行版。
          echo "=== Add Debian trixie repository for WPE 2.0 packages ==="
          echo "deb [signed-by=/usr/share/keyrings/debian-archive-keyring.gpg] https://deb.debian.org/debian trixie main" | sudo tee /etc/apt/sources.list.d/debian-trixie.list > /dev/null
          cat <<'EOF' | sudo tee /etc/apt/preferences.d/debian-trixie-wpe.pref > /dev/null
          Package: *
          Pin: release n=trixie
          Pin-Priority: 100

          Package: libwpe* wpebackend-* libwpewebkit-2.0-1 libjavascriptcoregtk-6.0-* gir1.2-wpewebkit-6.0 gir1.2-javascriptcoregtk-6.0
          Pin: release n=trixie
          Pin-Priority: 990
          EOF
          sudo apt-get update -y
          echo "=== apt-cache policy (WPE packages) ==="
          apt-cache policy \
            base-files \
            libwpewebkit-2.0-dev \
            libwpebackend-fdo-1.0-dev \
            libwpe-1.0-dev || true
          # 这里不能再用 `-t trixie`，否则 apt 会把整个 Debian trixie 发行版都当成
          # 默认候选，像 base-files 这类基础包也会被拉进来，最终在 Ubuntu runner 上冲突。
          sudo apt-get install -y --no-install-recommends \
            libwpe-1.0-dev/trixie \
            libwpewebkit-2.0-dev/trixie \
            libwpebackend-fdo-1.0-dev/trixie
          echo "=== Linux WebKit/WPE pkg-config check ==="
          pkg-config --modversion wpe-webkit-2.0 || true
          pkg-config --modversion wpe-webkit-1.1 || true
          pkg-config --modversion wpe-webkit-1.0 || true
          pkg-config --modversion wpebackend-fdo-1.0 || true
          pkg-config --modversion wpe-platform-2.0 || true
          pkg-config --modversion wpe-platform-headless-2.0 || true
          pkg-config --modversion wpe-1.0 || true
          pkg-config --modversion libsecret-1 || true
          pkg-config --modversion wayland-server || true
          flutter config --enable-linux-desktop
          dart pub global activate flutter_distributor
          echo "✓ Linux dependencies and flutter_distributor installed"

      - name: Build
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          echo "=== Build Environment ==="
          echo "Platform: ${{ matrix.platform }}"
          echo "Build platform: ${{ matrix.build_platform }}"
          echo "Arch: ${{ matrix.arch }}"
          echo "Flavor: ${{ matrix.build_flavor }}"
          echo "Flutter target: ${{ matrix.build_target }}"
          echo "IS_STABLE: ${{ env.IS_STABLE }}"
          echo "Current directory: $(pwd)"
          echo ""
          echo "=== Tool Versions ==="
          which flutter && flutter --version || echo "flutter not found"
          which dart && dart --version || echo "dart not found"
          which cargo && cargo --version || echo "cargo not found"
          which go && go version || echo "go not found"
          echo ""

          if [ "${{ matrix.build_platform }}" = "macos" ]; then
            echo "=== macOS Pre-Build Check ==="
            echo "Xcode version:"
            xcodebuild -version
            echo ""
            echo "Available SDKs:"
            xcodebuild -showsdks
            echo ""
            echo "libclash/macos directory (before core build):"
            ls -la ./libclash/macos/ 2>/dev/null || echo "libclash/macos not found yet"
            echo ""
            echo "Xcode project core reference:"
            grep -A2 "RuanjianyunCore\|NexGenCore" ./macos/Runner.xcodeproj/project.pbxproj | head -20 || echo "Core reference not found"
            echo ""
          fi

          if [ "${{ matrix.build_platform }}" = "windows" ]; then
            echo "=== Windows Build Tools ==="
            which cmake && cmake --version || echo "cmake not found"
            which msbuild && msbuild -version || echo "msbuild not found"
            echo "Visual Studio installations:"
            ls -la "/c/Program Files/Microsoft Visual Studio/" 2>/dev/null || echo "VS not found"
            ls -la "/c/Program Files (x86)/Microsoft Visual Studio/" 2>/dev/null || echo "VS x86 not found"
            echo ""
          fi

          echo "=== Checking flutter_distributor ==="
          which flutter_distributor || echo "flutter_distributor not in PATH"
          flutter_distributor --version || echo "flutter_distributor version failed"
          echo ""
          echo "=== Checking ISCC (Inno Setup) ==="
          which ISCC || echo "ISCC not in PATH"
          ls -la "/c/Program Files (x86)/Inno Setup 6/" 2>/dev/null || echo "Inno Setup dir not found"
          echo ""
          echo "=== Build Command ==="
          echo "Running: dart setup.dart ${{ matrix.build_platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ matrix.build_flavor && format('--flavor {0}', matrix.build_flavor) || '' }} ${{ matrix.build_target && format('--flutter-target {0}', matrix.build_target) || '' }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --version ${{ github.event.inputs.tag }}"
          echo ""
          echo "=== Build Output ==="
          set -o pipefail
          dart setup.dart ${{ matrix.build_platform }} ${{ matrix.arch && format('--arch {0}', matrix.arch) }} ${{ matrix.build_flavor && format('--flavor {0}', matrix.build_flavor) || '' }} ${{ matrix.build_target && format('--flutter-target {0}', matrix.build_target) || '' }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --version ${{ github.event.inputs.tag }} 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Build Exit Code: $BUILD_EXIT_CODE ==="

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED - Collecting Debug Information ==="
            echo ""
            if [ "${{ matrix.build_platform }}" = "windows" ]; then
              echo "=== CMake Error Logs ==="
              find ./build/windows -name "CMakeError.log" -exec echo "File: {}" \; -exec cat {} \; 2>/dev/null || echo "No CMakeError.log found"
              echo ""

              echo "=== CMake Output Logs ==="
              find ./build/windows -name "CMakeOutput.log" -exec echo "File: {}" \; -exec tail -100 {} \; 2>/dev/null || echo "No CMakeOutput.log found"
              echo ""

              echo "=== MSBuild Error Details ==="
              find ./build/windows -name "*.log" -exec echo "File: {}" \; -exec tail -50 {} \; 2>/dev/null || echo "No MSBuild logs found"
              echo ""

              echo "=== Flutter Build Verbose Output (last 200 lines) ==="
              tail -200 build.log 2>/dev/null || echo "No build log"
              echo ""

              echo "=== Windows Build Directory Structure ==="
              ls -laR ./build/windows/ 2>/dev/null | head -100 || echo "No build directory"
              echo ""
            elif [ "${{ matrix.build_platform }}" = "macos" ]; then
              echo "=== macOS Core File Check ==="
              echo "libclash/macos contents:"
              ls -la ./libclash/macos/ 2>/dev/null || echo "libclash/macos not found"
              echo ""
              echo "libclash/macos/arm64 contents:"
              ls -la ./libclash/macos/arm64/ 2>/dev/null || echo "libclash/macos/arm64 not found"
              echo ""
              echo "libclash/macos/amd64 contents:"
              ls -la ./libclash/macos/amd64/ 2>/dev/null || echo "libclash/macos/amd64 not found"
              echo ""
              
              echo "=== Xcode Build Logs ==="
              find ./build/macos -name "*.log" -exec echo "File: {}" \; -exec tail -100 {} \; 2>/dev/null || echo "No Xcode logs found"
              echo ""
              
              echo "=== Flutter Assemble Script Content ==="
              SCRIPT_PATH="./build/macos/Build/Intermediates.noindex/Runner.build/Release/Flutter Assemble.build/Script-33CC111E2044C6BF0003C045.sh"
              if [ -f "$SCRIPT_PATH" ]; then
                cat "$SCRIPT_PATH"
              else
                echo "Script not found at: $SCRIPT_PATH"
                find ./build/macos -name "*.sh" 2>/dev/null | head -10
              fi
              echo ""
              
              echo "=== DerivedData Logs ==="
              find ~/Library/Developer/Xcode/DerivedData -name "*.log" -mmin -10 2>/dev/null | while read f; do
                echo "=== $f ==="
                tail -50 "$f"
              done || echo "No recent DerivedData logs"
              echo ""
              
              echo "=== Xcode Build Output (xcactivitylog) ==="
              find ./build/macos -name "*.xcactivitylog" 2>/dev/null | head -5 || echo "No xcactivitylog found"
              echo ""
              
              echo "=== CocoaPods Status ==="
              cat ./macos/Podfile.lock 2>/dev/null | head -50 || echo "No Podfile.lock"
              echo ""
              
              echo "=== Flutter Assemble Script Location ==="
              ls -la ./build/macos/Build/Intermediates.noindex/Runner.build/Release/ 2>/dev/null || echo "Build intermediates not found"
              echo ""
            elif [ "${{ matrix.build_platform }}" = "linux" ]; then
              echo "=== Linux Build Directory Structure ==="
              ls -laR ./build/linux/ 2>/dev/null | head -200 || echo "No linux build directory"
              echo ""

              echo "=== Linux Packaging Directory Structure ==="
              ls -laR ./linux/packaging/ 2>/dev/null | head -200 || echo "No linux packaging directory"
              echo ""

              echo "=== Linux Output Files ==="
              find . -type f \( -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) 2>/dev/null | head -50 || echo "No Linux packages found"
              echo ""
            fi

            echo "=== Full Build Log (last 300 lines) ==="
            tail -300 build.log 2>/dev/null || echo "No build log"

            exit $BUILD_EXIT_CODE
          fi

      - name: List dist contents
        if: success() && steps.check.outputs.should_run == 'true'
        run: |
          echo "=== source/dist contents ==="
          ls -la ./source/dist/ 2>/dev/null || echo "source/dist not found or empty"
          find ./source/dist -type f 2>/dev/null || echo "No files in dist"
          echo ""

          if [ "${{ matrix.build_platform }}" = "windows" ]; then
            echo "=== source/build/windows contents ==="
            ls -la ./source/build/windows/ 2>/dev/null || echo "source/build/windows not found"
            echo ""
            echo "=== All exe files in source ==="
            find ./source -name "*.exe" -type f 2>/dev/null | grep -v "build/windows/x64/CMakeFiles" | head -30 || echo "No exe files"
          elif [ "${{ matrix.build_platform }}" = "android" ]; then
            echo "=== source/build/app/outputs contents ==="
            ls -la ./source/build/app/outputs/ 2>/dev/null || echo "source/build/app/outputs not found"
            echo ""
            echo "=== All APK/AAB files in source ==="
            find ./source -name "*.apk" -o -name "*.aab" 2>/dev/null | head -30 || echo "No APK/AAB files"
          elif [ "${{ matrix.build_platform }}" = "linux" ]; then
            echo "=== source/build/linux contents ==="
            ls -la ./source/build/linux/ 2>/dev/null || echo "source/build/linux not found"
            echo ""
            echo "=== All Linux package files in source ==="
            find ./source -type f \( -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) 2>/dev/null | head -30 || echo "No Linux package files"
          fi

          echo ""
          echo "=== Build log tail ==="
          tail -100 ./source/build.log 2>/dev/null || echo "No build log"

      - name: Upload
        if: success() && steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.executable_names.outputs.profile_name_safe }}-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./source/dist
          overwrite: true
          if-no-files-found: error

  build-linux:
    runs-on: ${{ matrix.os }}
    container:
      image: debian:trixie
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            build_platform: linux
            os: ubuntu-24.04
            arch: amd64
            include_in_all: true
            flutter_channel: stable
            flutter_arch: x64
          - platform: linux
            build_platform: linux
            os: ubuntu-24.04-arm
            arch: arm64
            include_in_all: true
            flutter_channel: master
            flutter_arch: arm64

    steps:
      - name: Check if platform should run
        id: check
        run: |
          SELECTED="${{ github.event.inputs.platforms }}"
          CURRENT="${{ matrix.platform }}"
          ARCH="${{ matrix.arch }}"
          SHOULD_RUN="false"

          echo "Selected platforms: $SELECTED"
          echo "Current matrix: platform=$CURRENT, arch=$ARCH"

          if [[ "$SELECTED" == "all" ]]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",$CURRENT,"* ]]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",linux-arm64,"* ]] && [ "$ARCH" = "arm64" ]; then
            SHOULD_RUN="true"
          elif [[ ",$SELECTED," == *",linux-amd64,"* ]] && [ "$ARCH" = "amd64" ]; then
            SHOULD_RUN="true"
          fi

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT

          if [ "$SHOULD_RUN" = "false" ]; then
            echo "⏭️ Skipping linux ($ARCH) - not selected"
          else
            echo "✅ Building linux ($ARCH)"
          fi

      - name: Bootstrap Linux Container
        if: steps.check.outputs.should_run == 'true'
        run: |
          apt-get update -y
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            file \
            git \
            jq \
            nodejs \
            openssh-client \
            unzip \
            wget \
            xz-utils \
            zip

      - name: Clone private repo
        if: steps.check.outputs.should_run == 'true'
        run: |
          git config --global url."https://x-access-token:${{ secrets.WORKFLOW_TOKEN }}@github.com/".insteadOf "git@github.com:"
          git config --global url."https://x-access-token:${{ secrets.WORKFLOW_TOKEN }}@github.com/".insteadOf "ssh://git@github.com/"
          git clone https://x-access-token:${{ secrets.WORKFLOW_TOKEN }}@github.com/${{ env.PRIVATE_REPO }}.git source
          cd source
          REQUESTED_REF="${{ github.event.inputs.branch }}"
          SOURCE_REF="$REQUESTED_REF"
          if [ -z "$SOURCE_REF" ]; then
            SOURCE_REF="${{ github.event.inputs.tag }}"
          fi
          echo "Requested source ref: ${REQUESTED_REF:-<empty>}"
          echo "Checking out source ref: $SOURCE_REF"
          git checkout "$SOURCE_REF"
          echo "Checked out commit: $(git rev-parse HEAD)"
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Apply profile config
        id: config
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          PROFILE_NAME="${{ github.event.inputs.profile }}"
          echo "=== Applying profile: $PROFILE_NAME ==="

          PROFILE_PATH="profiles/$PROFILE_NAME.yaml"
          echo "Reading $PROFILE_PATH from main branch..."
          if ! git show "main:$PROFILE_PATH" > assets/config/xboard.config.yaml; then
            echo "Error: Failed to read $PROFILE_PATH from main branch"
            exit 1
          fi

          APP_NAME=$(node -e "
            const fs = require('fs');
            const yaml = fs.readFileSync('assets/config/xboard.config.yaml', 'utf8');
            const appBlockMatch = yaml.match(/(?:^|\r?\n)  app:\r?\n((?:    .*?(?:\r?\n|$)|\r?\n)*)/);
            const appTitleMatch = appBlockMatch ? appBlockMatch[1].match(/(?:^|\r?\n)    title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/) : null;
            const rootTitleMatch = yaml.match(/(?:^|\r?\n)  title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/);
            const rawName = appTitleMatch ? appTitleMatch[1].trim() : (rootTitleMatch ? rootTitleMatch[1].trim() : '$PROFILE_NAME');
            const appName = String(rawName || '').replace(/[\\r\\n]+/g, ' ').trim();
            console.log(appName);
          ")

          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "Successfully applied profile: $PROFILE_NAME, App Name: $APP_NAME"
          echo ""
          echo "=== Config file content (first 30 lines) ==="
          head -30 assets/config/xboard.config.yaml

      - name: Setup Go
        if: steps.check.outputs.should_run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: source/core/go.sum

      - name: Setup Flutter (Linux)
        if: steps.check.outputs.should_run == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: "${{ matrix.flutter_channel }}"
          flutter-version: "${{ env.FLUTTER_VERSION }}"
          architecture: "${{ matrix.flutter_arch }}"
          cache: true

      - name: Mark Flutter SDK as safe git directory
        if: steps.check.outputs.should_run == 'true'
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_ROOT="$(dirname "$(dirname "$(readlink -f "$FLUTTER_BIN")")")"
          git config --global --add safe.directory "$FLUTTER_ROOT"
          echo "Configured git safe.directory: $FLUTTER_ROOT"

      - name: Get Flutter Dependency
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          flutter pub get

      - name: Patch flutter_inappwebview_linux for WebKit < 2.50
        if: steps.check.outputs.should_run == 'true'
        run: |
          PLUGIN_FILE="$(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*flutter_inappwebview_linux-*/linux/in_app_webview/in_app_webview.cc' | head -1)"
          if [ -z "$PLUGIN_FILE" ]; then
            echo "flutter_inappwebview_linux source file not found"
            exit 1
          fi

          echo "Patching plugin file: $PLUGIN_FILE"
          if grep -q 'WEBKIT_CHECK_VERSION(2, 50, 0)' "$PLUGIN_FILE"; then
            echo "Plugin already patched"
          else
            perl -0pi -e 's@std::optional<std::string> InAppWebView::getMetaThemeColor\(\) const \{\n.*?\n  return std::string\(hexColor\);\n\}@std::optional<std::string> InAppWebView::getMetaThemeColor() const {\n  if (webview_ == nullptr) return std::nullopt;\n\n#if !WEBKIT_CHECK_VERSION(2, 50, 0)\n  return std::nullopt;\n#else\n  WebKitColor color;\n  gboolean hasColor = webkit_web_view_get_theme_color(webview_, &color);\n\n  if (!hasColor) {\n    return std::nullopt;\n  }\n\n  // Convert WebKitColor (RGBA in 0.0-1.0 range) to hex string format #RRGGBBAA\n  // Note: WebKitColor has red, green, blue, alpha as gdouble (0.0-1.0)\n  int r = static_cast<int>(color.red * 255.0 + 0.5);\n  int g = static_cast<int>(color.green * 255.0 + 0.5);\n  int b = static_cast<int>(color.blue * 255.0 + 0.5);\n  int a = static_cast<int>(color.alpha * 255.0 + 0.5);\n\n  // Clamp values to 0-255\n  r = std::max(0, std::min(255, r));\n  g = std::max(0, std::min(255, g));\n  b = std::max(0, std::min(255, b));\n  a = std::max(0, std::min(255, a));\n\n  char hexColor[10];\n  if (a == 255) {\n    snprintf(hexColor, sizeof(hexColor), "#%02X%02X%02X", r, g, b);\n  } else {\n    snprintf(hexColor, sizeof(hexColor), "#%02X%02X%02X%02X", r, g, b, a);\n  }\n\n  return std::string(hexColor);\n#endif\n}@s or die "Failed to patch getMetaThemeColor()\n";' "$PLUGIN_FILE"
          fi

          echo "=== Patched getMetaThemeColor snippet ==="
          sed -n '/std::optional<std::string> InAppWebView::getMetaThemeColor() const {/,/int r = static_cast<int>(color.red/p' "$PLUGIN_FILE" | head -40

      - name: Generate Executable Names
        if: steps.check.outputs.should_run == 'true'
        id: executable_names
        run: |
          cd source
          echo "=== Generating Executable Names ==="
          dart run scripts/generate_executable_names.dart
          echo ""
          echo "=== Generated Executable Names ==="
          cat lib/generated/executable_names.dart

          PINYIN_NAME=$(grep "const String executableAppName = '" lib/generated/executable_names.dart | sed "s/.*const String executableAppName = '\([^']*\)'.*/\1/")
          echo "profile_name_safe=$PINYIN_NAME" >> $GITHUB_OUTPUT
          echo "Extracted pinyin name: $PINYIN_NAME"

      - name: Generate SDK Code
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source/lib/sdk/flutter_xboard_sdk
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate Main Project Code
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          dart run build_runner build --delete-conflicting-outputs

      - name: Generate XBoard Config
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          echo "=== Generating XBoard Config ==="
          dart run tools/generate_config.dart
          echo ""
          echo "=== Generated Config ==="
          cat lib/xboard/config/core/generated_config.dart
          echo ""
          echo "=== Pubspec Assets Check ==="
          grep -A 10 "assets:" pubspec.yaml || echo "No assets section found"

      - name: Prepare Linux Build Environment
        if: steps.check.outputs.should_run == 'true'
        run: |
          echo "Preparing Linux build environment in Debian trixie container..."
          apt-get update -y
          apt-get install -y --no-install-recommends \
            clang \
            cmake \
            g++ \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            libepoxy-dev \
            libsecret-1-dev \
            libwayland-dev \
            libwpe-1.0-dev \
            libwpewebkit-2.0-dev \
            libwpebackend-fdo-1.0-dev \
            libayatana-appindicator3-dev \
            libkeybinder-3.0-dev
          echo "=== Linux WebKit/WPE pkg-config check ==="
          pkg-config --modversion wpe-webkit-2.0 || true
          pkg-config --modversion wpe-webkit-1.1 || true
          pkg-config --modversion wpe-webkit-1.0 || true
          pkg-config --modversion wpebackend-fdo-1.0 || true
          pkg-config --modversion wpe-platform-2.0 || true
          pkg-config --modversion wpe-platform-headless-2.0 || true
          pkg-config --modversion wpe-1.0 || true
          pkg-config --modversion libsecret-1 || true
          pkg-config --modversion wayland-server || true
          echo "CFLAGS=-Wno-error=deprecated-declarations" >> $GITHUB_ENV
          echo "CXXFLAGS=-Wno-error=deprecated-declarations" >> $GITHUB_ENV
          flutter config --enable-linux-desktop
          PUB_CACHE_BIN="${HOME}/.pub-cache/bin"
          echo "$PUB_CACHE_BIN" >> $GITHUB_PATH
          export PATH="$PUB_CACHE_BIN:$PATH"
          dart pub global activate flutter_distributor
          echo "✓ Linux dependencies and flutter_distributor installed"

      - name: Build
        if: steps.check.outputs.should_run == 'true'
        run: |
          cd source
          echo "=== Build Environment ==="
          echo "Platform: linux"
          echo "Arch: ${{ matrix.arch }}"
          echo "IS_STABLE: ${{ env.IS_STABLE }}"
          echo "Current directory: $(pwd)"
          echo ""
          echo "=== Tool Versions ==="
          which flutter && flutter --version || echo "flutter not found"
          which dart && dart --version || echo "dart not found"
          which go && go version || echo "go not found"
          which g++ && g++ --version | head -1 || echo "g++ not found"
          echo "CFLAGS=${CFLAGS:-<empty>}"
          echo "CXXFLAGS=${CXXFLAGS:-<empty>}"
          which flutter_distributor && flutter_distributor --version || echo "flutter_distributor not found"
          echo ""
          echo "=== Build Command ==="
          echo "Running: dart setup.dart linux --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --version ${{ github.event.inputs.tag }}"
          echo ""
          echo "=== Build Output ==="
          set -o pipefail
          dart setup.dart linux --arch ${{ matrix.arch }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --version ${{ github.event.inputs.tag }} 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo ""
          echo "=== Build Exit Code: $BUILD_EXIT_CODE ==="

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo ""
            echo "=== BUILD FAILED - Collecting Debug Information ==="
            echo "=== Linux Build Directory Structure ==="
            ls -laR ./build/linux/ 2>/dev/null | head -200 || echo "No linux build directory"
            echo ""
            echo "=== Linux Packaging Directory Structure ==="
            ls -laR ./linux/packaging/ 2>/dev/null | head -200 || echo "No linux packaging directory"
            echo ""
            echo "=== Linux Output Files ==="
            find . -type f \( -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) 2>/dev/null | head -50 || echo "No Linux packages found"
            echo ""
            echo "=== Full Build Log (last 300 lines) ==="
            tail -300 build.log 2>/dev/null || echo "No build log"
            exit $BUILD_EXIT_CODE
          fi

      - name: List dist contents
        if: success() && steps.check.outputs.should_run == 'true'
        run: |
          echo "=== source/dist contents ==="
          ls -la ./source/dist/ 2>/dev/null || echo "source/dist not found or empty"
          find ./source/dist -type f 2>/dev/null || echo "No files in dist"
          echo ""
          echo "=== source/build/linux contents ==="
          ls -la ./source/build/linux/ 2>/dev/null || echo "source/build/linux not found"
          echo ""
          echo "=== All Linux package files in source ==="
          find ./source -type f \( -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) 2>/dev/null | head -30 || echo "No Linux package files"
          echo ""
          echo "=== Build log tail ==="
          tail -100 ./source/build.log 2>/dev/null || echo "No build log"

      - name: Upload
        if: success() && steps.check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.executable_names.outputs.profile_name_safe }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./source/dist
          overwrite: true
          if-no-files-found: error

  # 合并所有平台的构建产物到一个 Artifact（方便下载）
  merge-artifacts:
    runs-on: ubuntu-latest
    needs: [ build, build-linux ]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.build-linux.result == 'success' }}
    steps:
      - name: Get app name from config
        id: config
        run: |
          PROFILE_NAME="${{ github.event.inputs.profile }}"
          
          PROFILE_PATH="profiles/$PROFILE_NAME.yaml"
          ENCODED_PROFILE_PATH=$(node -e "console.log(process.argv[1].split('/').map(encodeURIComponent).join('/'))" "$PROFILE_PATH")

          # 通过 GitHub API 获取 YAML 配置档案
          API_RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.WORKFLOW_TOKEN }}" \
            "https://api.github.com/repos/q42602736/Xboard-Mihomo_sub/contents/${ENCODED_PROFILE_PATH}?ref=main")
          
          # 检查是否成功获取
          if echo "$API_RESPONSE" | grep -q '"content"'; then
            PROFILE_YAML=$(echo "$API_RESPONSE" | node -e "
              const d=require('fs').readFileSync(0,'utf8');
              const j=JSON.parse(d);
              if(j.content) process.stdout.write(Buffer.from(String(j.content).replace(/\\n/g, ''),'base64').toString());
            ")
            
            APP_NAME=$(printf '%s' "$PROFILE_YAML" | node -e "
              const fs = require('fs');
              const yaml = fs.readFileSync(0, 'utf8');
              const appBlockMatch = yaml.match(/(?:^|\r?\n)  app:\r?\n((?:    .*?(?:\r?\n|$)|\r?\n)*)/);
              const appTitleMatch = appBlockMatch ? appBlockMatch[1].match(/(?:^|\r?\n)    title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/) : null;
              const rootTitleMatch = yaml.match(/(?:^|\r?\n)  title:\s*['\\\"]?([^'\"\\r\\n]+)['\\\"]?/);
              const rawName = appTitleMatch ? appTitleMatch[1].trim() : (rootTitleMatch ? rootTitleMatch[1].trim() : '$PROFILE_NAME');
              console.log(String(rawName || '').replace(/[\\r\\n]+/g, ' ').trim());
            ")
          else
            echo "Failed to get profile yaml, using profile name as app name"
            APP_NAME="$PROFILE_NAME"
          fi
          
          echo "app_name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "App Name: $APP_NAME"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist/
          merge-multiple: true

      - name: Check artifacts
        id: check
        run: |
          if [ -d "./dist" ] && [ "$(ls -A ./dist 2>/dev/null)" ]; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
            echo "Found artifacts:"
            ls -la ./dist/
            
            # 从构建产物文件名中提取拼音应用名称
            # 例如：Qieyun-1.0.0-android-arm64-v8a.apk -> Qieyun
            FIRST_FILE=$(find ./dist -type f \( -iname "*.apk" -o -iname "*.dmg" -o -iname "*.exe" -o -iname "*.deb" -o -iname "*.appimage" -o -iname "*.rpm" \) | head -1)
            if [ -n "$FIRST_FILE" ]; then
              FILENAME=$(basename "$FIRST_FILE")
              # 提取第一个 - 之前的部分作为拼音应用名称
              PINYIN_NAME=$(echo "$FILENAME" | sed 's/-.*$//')
              echo "profile_name_safe=$PINYIN_NAME" >> $GITHUB_OUTPUT
              echo "Extracted pinyin name: $PINYIN_NAME"
            else
              echo "profile_name_safe=app" >> $GITHUB_OUTPUT
              echo "No suitable file found, using default name"
            fi
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
            echo "No artifacts found"
          fi

      - name: Generate sha256
        if: steps.check.outputs.has_artifacts == 'true'
        run: |
          cd ./dist
          for file in $(find . -type f -not -name "*.sha256"); do
            sha256sum "$file" > "${file}.sha256"
          done

      - name: Package merged bundle
        if: steps.check.outputs.has_artifacts == 'true'
        id: package
        run: |
          PROFILE_NAME_SAFE="${{ steps.check.outputs.profile_name_safe }}"
          VERSION="${{ github.event.inputs.tag }}"
          PACKAGE_NAME="${PROFILE_NAME_SAFE}-${VERSION}-bundle.zip"

          mkdir -p ./release
          cd ./dist
          zip -r "../release/${PACKAGE_NAME}" . -x "*.DS_Store"

          echo "package_name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          echo "package_path=./release/${PACKAGE_NAME}" >> $GITHUB_OUTPUT
          echo "Created bundle: ./release/${PACKAGE_NAME}"

      - name: Upload merged bundle
        if: steps.check.outputs.has_artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.check.outputs.profile_name_safe }}-${{ github.event.inputs.tag }}-bundle
          path: ${{ steps.package.outputs.package_path }}
          retention-days: 30

      - name: Create Draft Release
        if: steps.check.outputs.has_artifacts == 'true'
        env:
          GH_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
        run: |
          APP_NAME="${{ steps.config.outputs.app_name }}"
          PROFILE_NAME="${{ github.event.inputs.profile }}"
          VERSION="${{ github.event.inputs.tag }}"
          RELEASE_TAG="${PROFILE_NAME}-${VERSION}-${{ github.run_id }}"
          PACKAGE_NAME="${{ steps.package.outputs.package_name }}"

          echo "Creating draft release: ${APP_NAME} ${VERSION} (tag: ${RELEASE_TAG})"

          # 检查 release 是否已存在（使用 profile+version+run_id 组合标签避免冲突）
          EXISTING=$(curl -s -H "Authorization: token ${{ secrets.WORKFLOW_TOKEN }}" "https://api.github.com/repos/q42602736/Xboard-Mihomo-builds/releases/tags/${RELEASE_TAG}" | grep -c '"id"' || true)

          if [ "$EXISTING" -gt 0 ]; then
            echo "Release ${RELEASE_TAG} already exists, deleting..."
            RELEASE_ID=$(curl -s -H "Authorization: token ${{ secrets.WORKFLOW_TOKEN }}" "https://api.github.com/repos/q42602736/Xboard-Mihomo-builds/releases/tags/${RELEASE_TAG}" | grep '"id"' | head -1 | grep -o '[0-9]*')
            curl -s -X DELETE -H "Authorization: token ${{ secrets.WORKFLOW_TOKEN }}" "https://api.github.com/repos/q42602736/Xboard-Mihomo-builds/releases/${RELEASE_ID}"
          fi

          RELEASE_PAYLOAD=$(node -e 'const [appName, version, releaseTag, profileName] = process.argv.slice(1); process.stdout.write(JSON.stringify({ tag_name: releaseTag, name: `${appName} ${version}`, draft: true, body: `${appName} ${version} 构建产物\n\n档案: ${profileName}` }));' "$APP_NAME" "$VERSION" "$RELEASE_TAG" "$PROFILE_NAME")

          RELEASE_RESPONSE=$(curl -s -X POST -H "Authorization: token ${{ secrets.WORKFLOW_TOKEN }}" -H "Content-Type: application/json" "https://api.github.com/repos/q42602736/Xboard-Mihomo-builds/releases" -d "$RELEASE_PAYLOAD")

          RELEASE_ID=$(echo "$RELEASE_RESPONSE" | node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(0,'utf8')); console.log(data.id || '');")
          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync(0,'utf8')); console.log((data.upload_url || '').replace(/\{.*$/, ''));")

          echo "Release ID: $RELEASE_ID"
          echo "Upload URL: $UPLOAD_URL"

          # 只上传合集包
          cd ./release
          filesize=$(du -h "$PACKAGE_NAME" | cut -f1)
          echo "Uploading bundle: $PACKAGE_NAME ($filesize)"

          encoded_filename=$(node -e "console.log(encodeURIComponent(process.argv[1]))" "$PACKAGE_NAME")

          curl -s -X POST -H "Authorization: token ${{ secrets.WORKFLOW_TOKEN }}" -H "Content-Type: application/zip" "${UPLOAD_URL}?name=${encoded_filename}" --data-binary @"$PACKAGE_NAME" || echo "Failed to upload $PACKAGE_NAME"

          echo "Draft release created successfully!"
          echo "View at: https://github.com/q42602736/Xboard-Mihomo-builds/releases"
